,{t:"주택임대차보호법 핵심",b:"계약갱신청구권, 전월세상한제, 묵시적 갱신 세 가지만 알아도 대부분의 분쟁을 피합니다. 법조문을 직접 한 번은 읽어보세요.",k:["계약갱신청구권","전월세상한제","묵시적갱신"],a:"주택임대차보호법에서 갱신 관련 조문을 찾아 읽고, 집주인이 갱신을 거절할 수 있는 경우를 전부 적기",q:"갱신청구는 계약 만료 몇 개월 전에 해야 하나?"}
,{t:"전월세전환율",b:"전세를 월세로 바꿀 때 적용하는 비율입니다. 이 숫자를 알면 전세와 월세 매물을 같은 자로 비교할 수 있어요.",k:["전월세전환율","환산보증금"],a:"관심지역 전세매물 1건을 월세로 환산해, 실제 월세 매물 가격과 비교하기",q:"전환율이 높으면 세입자에게 유리한가 불리한가?"}
,{t:"등기부 위험 신호 10가지",b:"가압류·가처분·가등기·신탁·경매개시·압류·예고등기 등은 전부 빨간불입니다. 하나라도 있으면 계약 전에 멈추세요.",k:["가등기","가처분","신탁등기","압류"],a:"위험 신호 10개를 목록으로 정리하고, 각각 무슨 뜻인지 한 줄씩 붙여 카드 저장",q:"신탁등기된 집의 실제 소유자는 누구인가?"}
,{t:"선순위 임차인 확인하는 법",b:"다가구는 나보다 먼저 들어온 세입자들의 보증금 총액이 곧 내 위험입니다. 확정일자 부여현황을 요구해서 받으세요.",k:["선순위임차인","확정일자부여현황","전입세대열람"],a:"전입세대열람원과 확정일자 부여현황을 어디서 어떻게 떼는지 절차를 적어두기",q:"임대인이 이 서류 제공을 거부하면 어떻게?"}
,{t:"신탁·가등기·가처분 실전",b:"신탁된 집은 수탁자(신탁사) 동의 없이 한 계약은 무효가 될 수 있습니다. 실제 사고가 가장 많이 나는 유형이에요.",k:["수탁자","우선수익자","신탁원부"],a:"신탁원부를 어디서 떼는지 확인하고, 신탁 물건 계약 시 필요한 서류 목록 적기",q:"신탁 물건에서 임대차 동의서가 없으면?"}
,{t:"다가구·다세대·오피스텔 구분",b:"다가구는 건물 전체가 한 명 소유(등기 1개), 다세대는 호수별 등기입니다. 이 차이가 보증금 안전에 직결돼요.",k:["다가구","다세대","연립","오피스텔"],a:"세 유형의 등기 구조·보증금 위험·대출 가능성을 표로 비교",q:"다가구 전세가 다세대보다 위험한 이유는?"}
,{t:"[1단계 졸업시험] 매물 1건 완전 해부",b:"4주 동안 배운 걸 전부 씁니다. 실제 매물 하나를 골라 서류부터 시세까지 혼자 끝까지 분석하세요.",k:["종합분석","리포트"],a:"실제 매물 1건: 등기부·건축물대장 해석 + 시세 3종 비교 + 안전도 판정까지 A4 2장 리포트 작성해 카드 저장",q:"이 집을 친구에게 추천할까 말릴까, 이유는?"}
,{t:"[2단계] 입지의 4요소",b:"직장·교통·학군·환경. 이 넷의 가중치는 사람마다 다릅니다. 내 가중치를 정하는 게 오늘의 일이에요.",k:["입지","직주근접","가중치"],a:"4요소에 각각 몇 %의 가중치를 줄지 정하고 이유를 적기(합 100%)",q:"나에게 가장 안 중요한 요소는 무엇이고 왜?"}
,{t:"직주근접 — 통근시간 계산",b:"부동산 가격의 가장 큰 변수는 여전히 '주요 업무지구까지 몇 분'입니다. 도어투도어로 재야 진짜예요.",k:["업무지구","도어투도어","환승"],a:"관심지역 3곳에서 내 직장까지 실제 출근시간을 지도앱으로 오전 8시 기준 측정해 기록",q:"내가 감당할 수 있는 통근시간 상한은?"}
,{t:"교통 호재 단계 읽기",b:"예타→기본계획→착공→개통. 단계마다 가격 반영 폭이 다르고, 예타 단계 호재는 엎어지기도 합니다.",k:["예비타당성조사","기본계획","착공","개통"],a:"관심지역의 교통 계획 1건을 골라 현재 어느 단계인지, 예정 개통연도가 몇 번 밀렸는지 확인",q:"가장 위험한 단계는 어디인가?"}
,{t:"학군 데이터로 보기",b:"학군은 감이 아니라 배정 중학교, 학업성취도, 학원가 밀집도로 봅니다. 실거주 수요를 붙잡는 힘이 커요.",k:["학군","배정","학원가"],a:"관심 단지의 배정 초·중학교를 확인하고, 학군 때문에 가격차가 나는 옆 단지와 평단가 비교",q:"학군 프리미엄은 몇 % 정도 붙어 있나?"}
,{t:"상권과 생활 인프라",b:"대형마트·병원·공원까지의 거리는 실거주 만족도와 재매도 난이도를 동시에 결정합니다.",k:["생활권","인프라","슬세권"],a:"관심 단지 반경 1km 안의 마트·병원·공원·도서관을 지도에 표시하고 도보 시간 적기",q:"내가 포기 못 하는 인프라 1순위는?"}
,{t:"환경 — 소음·향·조망",b:"도로변 소음, 북향, 앞 동에 막힌 조망은 같은 단지 안에서도 수천만 원 차이를 만듭니다.",k:["향","조망","소음"],a:"관심 단지의 동·향별 실거래가 차이를 뽑아, 남향 프리미엄이 실제 얼마인지 숫자로 확인",q:"우리 지역에서 향보다 조망이 더 비싼가?"}
,{t:"[주간점검] 입지 점수표",b:"내가 정한 가중치로 관심지역을 점수화합니다. 감정이 아니라 표로 판단하는 훈련이에요.",k:["스코어링","가중치","비교"],a:"관심지역 3곳을 4요소 가중치로 100점 환산해 순위 매기고, 결과가 내 직감과 다르면 왜 다른지 적기",q:"점수와 직감이 다르면 뭘 믿을 것인가?"}
,{t:"단지 자체의 힘",b:"세대수·연식·브랜드·용적률은 단지의 체급입니다. 500세대 미만은 거래가 잘 안 붙는 경우가 많아요.",k:["세대수","용적률","건폐율","브랜드"],a:"관심 단지 3곳의 세대수·준공연도·용적률·건폐율을 표로 정리하고 거래량과 비교",q:"용적률이 낮으면 왜 재건축에 유리한가?"}
,{t:"동·향·층의 가격차",b:"같은 단지 같은 평형이라도 동/향/층에 따라 10% 이상 벌어집니다. 로열동·로열층 기준을 알아야 협상할 수 있어요.",k:["로열동","로열층","저층할인"],a:"관심 단지 실거래 데이터를 층별로 나눠 저층·중층·고층 평균가 차이를 계산",q:"1층·탑층은 몇 % 할인되어 거래되나?"}
,{t:"평면 구조 읽기",b:"판상형/타워형, 3베이/4베이, 맞통풍 여부가 실거주 만족과 가격을 갈라놓습니다.",k:["판상형","타워형","베이","맞통풍"],a:"관심 단지 평면도를 구해 베이 수와 맞통풍 여부를 확인하고, 같은 평형 다른 타입과 실거래가 비교",q:"4베이가 항상 좋은가? 단점은?"}
,{t:"주차와 커뮤니티",b:"세대당 주차대수 1대 미만인 구축은 실거주 스트레스가 크고 매도 시에도 약점이 됩니다.",k:["주차대수","지하주차장","커뮤니티"],a:"관심 단지의 세대당 주차대수를 확인하고, 지하주차장-엘리베이터 직결 여부 체크",q:"세대당 주차 몇 대를 내 최저 기준으로 할까?"}
,{t:"관리비 뜯어보기",b:"공동관리비·개별사용료·장기수선충당금으로 나뉩니다. 충당금은 세입자가 내면 나중에 돌려받아야 해요.",k:["관리비","장기수선충당금","공용관리비"],a:"공동주택관리정보시스템에서 관심 단지 관리비를 조회해 ㎡당 금액을 옆 단지와 비교",q:"장기수선충당금은 원래 누가 부담하나?"}
,{t:"인구·세대수 데이터 보기",b:"인구는 줄어도 세대수는 늘 수 있습니다. 부동산 수요는 인구가 아니라 세대수를 따라가요.",k:["세대수","인구이동","KOSIS"],a:"통계청에서 관심지역의 최근 5년 세대수 증감과 인구 순이동을 뽑아 그래프로 그리기",q:"세대수는 느는데 인구는 주는 지역, 어떻게 해석할까?"}
,{t:"[주간점검] 단지 비교표 완성",b:"입지·단지·구조·관리비까지 한 표에 넣습니다. 이게 앞으로 매물을 볼 때마다 채울 양식이 됩니다.",k:["비교표","양식"],a:"관심 단지 5곳을 12개 항목으로 비교하는 표를 만들고 엑셀/노션으로 저장, 이번 주 용어 안 보고 설명",q:"내 표에서 가장 결정적인 열 3개는?"}
,{t:"입주물량 = 공급 읽기",b:"향후 2~3년 입주물량이 적정수요를 넘으면 전세가부터 흔들립니다. 지역 단위로 봐야 정확해요.",k:["입주물량","적정수요","공급과잉"],a:"관심지역의 2026~2028 입주물량과 적정수요(인구×0.5%)를 비교해 과잉/부족 판정",q:"적정수요를 넘는 해는 몇 년도인가?"}
,{t:"미분양 데이터",b:"미분양, 특히 '준공 후 미분양'은 시장의 체온계입니다. 늘어나기 시작하는 시점이 신호예요.",k:["미분양","준공후미분양","악성미분양"],a:"국토부 통계에서 관심지역 미분양 추이 3년치를 확인하고 방향(증가/감소) 기록",q:"준공 후 미분양이 일반 미분양보다 심각한 이유는?"}
,{t:"전세가율의 의미",b:"전세가율이 높으면 실수요가 받쳐준다는 뜻이자, 갭이 작다는 뜻입니다. 너무 높으면 위험 신호이기도 해요.",k:["전세가율","갭","실수요"],a:"관심지역 전세가율의 5년 추이를 찾아 현재 위치가 상단인지 하단인지 판단",q:"전세가율이 낮아지는 국면은 무슨 뜻일까?"}
,{t:"매매와 전세의 관계",b:"전세는 사용가치, 매매는 사용가치+미래가치입니다. 둘의 간격이 곧 기대심리예요.",k:["사용가치","미래가치","갭투자"],a:"관심 단지의 매매가·전세가 5년 그래프를 겹쳐 그려 벌어진 시기와 좁혀진 시기를 표시",q:"둘이 같이 오르는 국면과 매매만 오르는 국면의 차이는?"}
,{t:"거래량이라는 지표",b:"가격보다 거래량이 먼저 움직입니다. 거래량 급감 후 가격 하락, 거래량 회복 후 가격 상승이 일반적이에요.",k:["거래량","선행지표","월별추이"],a:"관심지역 아파트 월별 거래량 3년치를 뽑아 최근 6개월 방향 확인",q:"거래량 바닥은 언제였나?"}
,{t:"심리지표 읽기",b:"매수우위지수, 소비심리지수는 시장의 기분입니다. 100을 기준으로 위아래를 봅니다.",k:["매수우위지수","소비심리지수","기준선"],a:"KB 또는 국토연구원 심리지수의 최근 1년 흐름을 확인하고 현재 값 기록",q:"심리지표만 믿으면 안 되는 이유는?"}
,{t:"[주간점검] 수급 리포트",b:"공급·미분양·전세가율·거래량·심리를 한 장에 모읍니다. 지역 하나를 데이터로 설명할 수 있어야 해요.",k:["수급","종합판단"],a:"관심지역 1곳의 5개 지표를 한 장에 정리하고 '지금 사도 되는가'에 대한 내 결론과 근거 3줄 쓰기",q:"내 결론을 뒤집을 수 있는 데이터는 무엇일까?"}
,{t:"금리와 집값",b:"금리는 대출이자이자 기회비용입니다. 기준금리보다 실제로는 주담대 가산금리와 대출 규제가 더 직접적이에요.",k:["기준금리","가산금리","코픽스"],a:"현재 기준금리와 주요 은행 주담대 금리 범위를 찾아 적고, 1년 전과 비교",q:"금리가 내려도 집값이 안 오르는 경우는?"}
,{t:"유동성과 통화량",b:"돈이 많이 풀리면 실물자산 가격이 오릅니다. M2 증가율은 장기 흐름을 볼 때 유용해요.",k:["M2","유동성","실물자산"],a:"한국은행 경제통계시스템에서 M2 증가율 5년 추이를 확인",q:"유동성 지표는 단기 매수 타이밍에도 쓸 수 있을까?"}
,{t:"부동산 사이클 4국면",b:"회복-호황-침체-불황이 반복됩니다. 국면마다 거래량·전세가율·미분양의 조합이 다릅니다.",k:["사이클","회복기","침체기"],a:"4국면별 지표 조합을 표로 만들고, 관심지역이 지금 어느 국면인지 근거와 함께 판정",q:"내가 판정한 국면에서 해야 할 행동은?"}
,{t:"지역마다 사이클이 다른 이유",b:"공급 일정과 산업 구조가 지역마다 다르기 때문입니다. 서울이 오를 때 지방이 빠지는 게 이상한 일이 아니에요.",k:["디커플링","지역장세","산업기반"],a:"서울·경기·내 관심 지방 도시 1곳의 최근 3년 가격지수를 겹쳐 그려 차이 확인",q:"내 관심지역의 사이클을 좌우하는 산업은?"}
,{t:"수도권과 지방의 구조 차이",b:"수도권은 수요가 두껍고 지방은 공급 한 방에 흔들립니다. 같은 전략을 쓰면 안 돼요.",k:["수요층","공급탄력성","환금성"],a:"관심 지방 도시 1곳의 연간 거래량과 서울 한 개 구의 거래량을 비교해 환금성 차이 체감",q:"환금성이 낮은 지역에서 지켜야 할 원칙은?"}
,{t:"신축 프리미엄의 수명",b:"신축 프리미엄은 대체로 5~10년에 걸쳐 줄어듭니다. 대신 구축은 재건축 기대가 붙기 시작해요.",k:["신축프리미엄","연식","U자곡선"],a:"같은 지역에서 연식별(1년/10년/20년/30년) 평단가를 뽑아 곡선 그리기",q:"우리 지역 평단가가 가장 낮은 연식대는?"}
,{t:"[주간점검] 지금은 어디쯤인가",b:"2주간 배운 시장 지표를 총동원해 현재 국면을 판정합니다. 12월에 다시 꺼내볼 기록이에요.",k:["국면판정","기록"],a:"오늘 날짜로 '내 관심지역 시장 진단서'를 쓰고 6개월 뒤 확인할 예측 3개를 적어 카드 저장",q:"내 예측이 틀렸다면 무엇 때문일까?"}
,{t:"청약통장 제대로 알기",b:"통장 종류, 납입 인정 금액, 가입 기간이 당첨을 좌우합니다. 내 통장 상태부터 정확히 봐야 해요.",k:["주택청약종합저축","납입인정","무주택기간"],a:"내 청약통장의 가입일·총납입액·인정 회차를 확인하고 캡처해 카드 저장",q:"매달 얼마씩 넣는 게 나에게 유리한가?"}
,{t:"가점제 직접 계산",b:"무주택기간(32)+부양가족(35)+통장기간(17)=84점 만점입니다. 부양가족 점수가 가장 크게 작용해요.",k:["청약가점","무주택기간","부양가족"],a:"내 가점을 항목별로 계산해 총점을 내고, 관심지역 최근 당첨 커트라인과 비교",q:"내 점수로 현실적인 지역은 어디인가?"}
,{t:"추첨제와 특별공급",b:"가점이 낮으면 추첨제와 특공이 길입니다. 신혼·생애최초·다자녀 등 조건이 각각 달라요.",k:["추첨제","특별공급","생애최초"],a:"내가 지원 가능한 특공 유형이 있는지 소득·자산 요건과 대조해 확인",q:"특공은 평생 몇 번 쓸 수 있나?"}
,{t:"분양가와 전매 규제",b:"분양가 상한, 전매제한, 실거주 의무는 자주 바뀝니다. 오늘 기준을 직접 확인하는 습관이 중요해요.",k:["분양가상한제","전매제한","실거주의무"],a:"현재 시행 중인 전매제한·실거주 의무 규정을 청약홈에서 확인해 요약",q:"이 규정은 마지막으로 언제 바뀌었나?"}
,{t:"분양권과 입주권",b:"분양권은 청약 당첨으로 생긴 권리, 입주권은 재개발·재건축 조합원 권리입니다. 세금과 취득 방식이 완전히 달라요.",k:["분양권","입주권","조합원"],a:"둘의 취득세·양도세·대출 차이를 표로 정리",q:"주택 수 산정에서 분양권은 포함되나?"}
,{t:"모델하우스에서 볼 것",b:"모델하우스는 가장 잘 꾸며진 상태입니다. 유상옵션이 뭔지, 기본형이 어디까지인지를 봐야 해요.",k:["유상옵션","발코니확장","기본형"],a:"관심 분양 단지의 입주자모집공고를 열어 옵션 항목과 총 비용을 계산",q:"공고문에서 가장 먼저 봐야 할 항목은?"}
,{t:"[2단계 졸업시험] 지역 리포트",b:"입지·데이터·청약을 합쳐 지역 하나를 끝까지 분석합니다. 초보와 중급을 가르는 시험이에요.",k:["종합리포트","지역분석"],a:"관심지역 1곳: 입지 점수 + 수급 5지표 + 청약 가능성 + 내 결론까지 A4 3장 리포트 작성해 카드 저장",q:"이 지역을 한 문장으로 정의하면?"}
,{t:"[3단계] 내 돈부터 세기",b:"대출은 내 돈이 얼마인지 알아야 계산됩니다. 현금·예적금·주식·퇴직금·가용 지원까지 전부 적으세요.",k:["가용현금","순자산","자기자본"],a:"내 총 가용자금과 매달 저축 가능액을 정확히 계산해 표로 만들기",q:"비상금으로 남겨둘 금액은 얼마인가?"}
,{t:"LTV — 집값 기준 한도",b:"주택 가치 대비 대출 비율입니다. 규제지역·주택수·생애최초 여부에 따라 달라져요.",k:["LTV","담보인정비율","시세기준"],a:"내 조건에서 적용되는 LTV를 확인하고, 관심 매물 가격에 곱해 최대 담보 한도 계산",q:"LTV 계산의 기준 시세는 무엇인가?"}
,{t:"DTI — 소득 대비 상환",b:"주담대 원리금+기타대출 이자를 연소득으로 나눈 비율입니다. 지금은 DSR이 더 강력한 제약이에요.",k:["DTI","연소득","원리금"],a:"내 연소득으로 DTI 40% 기준 감당 가능한 연간 원리금을 계산",q:"DTI와 DSR의 결정적 차이는?"}
,{t:"DSR — 진짜 벽",b:"모든 대출의 원리금 상환액을 연소득으로 나눕니다. 신용대출·자동차할부·카드론까지 다 들어가요.",k:["DSR","총부채원리금","합산"],a:"내 모든 대출을 나열해 연간 원리금 총액을 구하고 DSR 계산, 한도까지 여유가 얼마인지 확인",q:"DSR을 낮추는 가장 빠른 방법은?"}
,{t:"스트레스 DSR",b:"미래 금리 상승을 가정해 가산금리를 얹어 한도를 계산합니다. 실제 한도가 눈에 띄게 줄어요.",k:["스트레스금리","가산","한도축소"],a:"현재 적용 중인 스트레스 금리 수준을 확인하고, 적용 전후 내 한도 차이를 계산",q:"스트레스 DSR을 피하는 대출 상품이 있나?"}
,{t:"정책 대출 상품들",b:"디딤돌·보금자리론·특례 상품은 금리가 낮은 대신 소득·집값 상한이 있습니다. 조건이 자주 바뀌어요.",k:["디딤돌대출","보금자리론","소득요건"],a:"현재 운영 중인 정책 주담대 3개의 조건을 표로 정리하고 내가 되는지 표시",q:"내가 지금 자격이 되는 상품이 있나?"}
,{t:"[주간점검] 내 대출 한도 확정",b:"LTV·DTI·DSR 세 관문을 다 통과한 값이 진짜 한도입니다. 셋 중 가장 작은 숫자가 답이에요.",k:["한도","최소값","자금계획"],a:"세 기준으로 각각 계산해 가장 작은 값을 내 한도로 확정하고, 가용현금과 합쳐 '내가 살 수 있는 최대 집값' 도출",q:"내 한도를 막고 있는 건 셋 중 무엇인가?"}
,{t:"고정·변동·혼합",b:"고정은 예측 가능, 변동은 하락기에 유리합니다. 금리 방향을 맞추려 하지 말고 내 감내 범위로 고르세요.",k:["고정금리","변동금리","혼합형"],a:"금리가 2%p 오르면 내 월 상환액이 얼마 늘어나는지 계산해보고 감당 가능한지 판단",q:"내가 못 버티는 금리는 몇 %부터인가?"}
,{t:"상환 방식 3가지",b:"원리금균등은 매달 같은 금액, 원금균등은 처음이 무겁고 총이자가 적습니다. 만기일시는 이자만 내다 한 번에 갚아요.",k:["원리금균등","원금균등","만기일시"],a:"같은 대출 조건으로 세 방식의 총이자를 계산해 비교(엑셀 또는 계산기)",q:"총이자만 보면 어느 쪽이 유리한가?"}
,{t:"중도상환수수료",b:"보통 3년 이내 갚으면 붙습니다. 갈아타기(대환) 계획이 있다면 이 숫자를 먼저 봐야 해요.",k:["중도상환수수료","대환","면제조건"],a:"주요 은행의 중도상환수수료율과 면제 조건을 조사해 정리",q:"3년을 못 채우고 갚아야 할 상황은 언제 생길까?"}
,{t:"신용대출이 주담대를 갉아먹는다",b:"마이너스통장은 안 써도 한도 전액이 DSR에 잡히는 경우가 있습니다. 집 사기 전에 정리해야 해요.",k:["마이너스통장","한도","DSR반영"],a:"내 신용대출·마통 한도를 확인하고, 없앴을 때 늘어나는 주담대 한도를 계산",q:"언제 정리하는 게 가장 효과적일까?"}
,{t:"전세자금대출",b:"버팀목·일반 전세대출은 조건과 한도가 다릅니다. 전세대출도 DSR에 영향을 줄 수 있어요.",k:["버팀목","전세대출","보증기관"],a:"현재 전세대출 상품 2개의 한도·금리·조건을 비교해 표로 정리",q:"전세대출을 끼고 집을 살 수 있나?"}
,{t:"대출 실행 절차와 서류",b:"사전심사→서류제출→감정→승인→실행. 잔금일에 맞추려면 최소 2~3주 전에 시작해야 합니다.",k:["사전심사","감정평가","기표"],a:"대출 실행까지 필요한 서류 목록과 소요 기간을 타임라인으로 그리기",q:"잔금일 며칠 전에 대출 신청을 시작해야 하나?"}
,{t:"[주간점검] 상환 시뮬레이션",b:"숫자를 직접 만들어봐야 감이 옵니다. 30년치 표를 한 번은 손으로 만들어보세요.",k:["시뮬레이션","상환표","현금흐름"],a:"내 예상 대출로 30년 상환표를 엑셀로 만들고, 월 상환액이 내 소득의 몇 %인지 계산",q:"소득 대비 상환 비율 상한을 몇 %로 정할까?"}
,{t:"취득세 — 살 때 내는 돈",b:"주택 가격과 보유 주택 수에 따라 세율이 달라집니다. 지방교육세·농특세까지 합쳐서 계산해야 해요.",k:["취득세","지방교육세","농어촌특별세"],a:"관심 매물 가격 기준 취득세 총액을 위택스 계산기로 계산해 기록",q:"85㎡ 초과면 무엇이 추가되나?"}
,{t:"다주택 취득세 중과",b:"주택 수와 지역에 따라 세율이 크게 뜁니다. 규정이 자주 바뀌니 계약 전 반드시 최신 확인이 필요해요.",k:["중과세율","주택수","일시적2주택"],a:"현재 기준 1·2·3주택 취득세율을 확인해 표로 만들고 개정일 함께 적기",q:"내가 이미 가진 주택 수는 세법상 몇 채인가?"}
,{t:"취득세 감면 제도 챙기기",b:"생애최초 구입, 신혼부부, 출산 가구 등에 감면이 있습니다. 안 챙기면 아무도 대신 챙겨주지 않아요.",k:["생애최초감면","신혼부부","감면요건"],a:"현재 시행 중인 취득세 감면 제도를 찾아 내가 해당되는 항목이 있는지 요건과 대조하고 감면액 계산",q:"감면을 받으면 지켜야 할 의무(거주·처분 제한)는?"}
,{t:"재산세 — 갖고 있으면 내는 돈",b:"매년 6월 1일 소유자가 1년치를 냅니다. 잔금일을 6월 초로 잡느냐 5월 말로 잡느냐가 돈이 돼요.",k:["재산세","과세기준일","공정시장가액비율"],a:"관심 매물의 공시가격으로 연간 재산세를 계산하고, 6월 1일 기준의 의미를 정리",q:"매도자와 매수자 중 누가 유리한 잔금일은 언제?"}
,{t:"종합부동산세",b:"공시가격 합계가 기준을 넘으면 부과됩니다. 1주택 실거주자에겐 공제가 큰 편이에요.",k:["종부세","공시가격합산","세액공제"],a:"현재 1주택자·다주택자 종부세 기본공제 금액을 확인해 적고, 내가 해당되는지 판단",q:"부부 공동명의는 종부세에 유리한가?"}
,{t:"양도세 기본 구조",b:"양도차익에서 필요경비와 공제를 빼고 보유기간별 세율을 곱합니다. 1년 미만 단타는 세율이 아주 높아요.",k:["양도차익","필요경비","보유기간세율"],a:"가상의 매매(3억 매수→4억 매도, 3년 보유)로 양도세를 직접 계산해보기",q:"필요경비로 인정되는 항목은 무엇들인가?"}
,{t:"[주간점검] 세금 3종 요약표",b:"살 때·가질 때·팔 때 세금을 한 장에 정리합니다. 이 표는 계약 직전에 매번 꺼내볼 거예요.",k:["취득","보유","양도"],a:"취득세·재산세/종부세·양도세를 한 장 표로 만들고 각 세금의 '기준 시점'을 표시해 카드 저장",q:"세 세금의 과세 기준일이 각각 언제인가?"}
,{t:"장기보유특별공제",b:"오래 보유하고 오래 거주할수록 양도세가 크게 줄어듭니다. 실거주 기간이 별도로 계산돼요.",k:["장특공제","보유기간","거주기간"],a:"1주택 기준 보유·거주 연수별 공제율 표를 만들어 저장",q:"거주 없이 보유만 하면 공제율 차이가 얼마나 나나?"}
,{t:"일시적 2주택",b:"새 집을 사고 옛 집을 정해진 기간 안에 팔면 1주택으로 봐줍니다. 기한을 하루라도 넘기면 세금이 달라져요.",k:["일시적2주택","처분기한","비과세"],a:"현재 기준 일시적 2주택 처분기한을 확인하고, 갈아타기 시나리오의 날짜 계획표 만들기",q:"기한 계산의 시작일은 언제인가?"}
,{t:"증여와 상속 기초",b:"부모 지원을 받는다면 증여세 신고 여부가 나중에 자금출처조사에서 문제가 됩니다. 미리 정리해두세요.",k:["증여세","공제한도","차용증"],a:"직계존속 증여공제 한도를 확인하고, 가족 지원을 받는다면 증여 vs 차용 중 무엇이 맞는지 판단",q:"차용증을 쓸 때 반드시 있어야 할 요소는?"}
,{t:"임대소득 과세",b:"월세를 받으면 소득입니다. 2주택 이상 월세, 3주택 이상 보증금 간주임대료가 과세 대상이에요.",k:["임대소득","분리과세","간주임대료"],a:"임대소득 과세 기준과 분리과세 요건을 정리해 표로 저장",q:"1주택자도 임대소득세를 낼 수 있나?"}
,{t:"중개보수 계산",b:"요율은 거래금액 구간별 상한이며 협의 가능합니다. 부가세가 별도로 붙는 경우도 있어요.",k:["중개보수","상한요율","협의"],a:"관심 매물 가격 기준 중개보수 상한을 계산하고, 협의 시 어떻게 말할지 문장 만들어두기",q:"매수자와 매도자 중 누가 얼마를 내나?"}
,{t:"부대비용 총정리",b:"취득세 말고도 법무사비·인지세·중개보수·이사·인테리어가 붙습니다. 보통 집값의 3~7%예요.",k:["법무사비","인지세","부대비용"],a:"관심 매물 기준 부대비용 항목을 전부 나열하고 총액과 집값 대비 비율 계산",q:"내가 빠뜨린 비용 항목은 없나?"}
,{t:"[주간점검] 총 매수비용 계산서",b:"집값이 전부가 아닙니다. 실제로 통장에서 나가는 돈을 한 장에 다 적어보세요.",k:["총비용","현금흐름","여유자금"],a:"집값+취득세+부대비용+이사+인테리어 총액을 계산하고, 내 가용현금으로 감당되는지 판정해 카드 저장",q:"부족하다면 얼마가 더 필요한가?"}
,{t:"규제지역 제도",b:"조정대상지역·투기과열지구는 대출·세금·전매를 한 번에 바꿉니다. 지정과 해제가 수시로 일어나요.",k:["조정대상지역","투기과열지구","규제지역"],a:"현재 지정된 규제지역 목록을 확인하고, 내 관심지역이 포함되는지 체크(확인 날짜 함께 기록)",q:"규제지역이면 내 대출 한도는 얼마나 줄어드나?"}
,{t:"토지거래허가구역",b:"허가구역에서는 실거주 목적이 아니면 매수 자체가 안 됩니다. 갭투자가 원천 차단돼요.",k:["토지거래허가","실거주의무","허가신청"],a:"현재 허가구역 지정 현황을 확인하고 허가 절차와 실거주 의무 기간 정리",q:"허가 없이 계약하면 그 계약은 어떻게 되나?"}
,{t:"자금조달계획서",b:"일정 금액 이상 거래는 돈의 출처를 문서로 냅니다. 증빙이 안 되면 세무조사로 이어질 수 있어요.",k:["자금조달계획서","증빙서류","자금출처"],a:"자금조달계획서 서식을 내려받아 내 상황으로 미리 한 번 채워보기",q:"내가 증빙하기 어려운 항목이 있나?"}
,{t:"주택 수 산정 기준",b:"세법·청약·대출에서 주택 수를 세는 방식이 서로 다릅니다. 분양권·입주권·오피스텔 처리가 특히 달라요.",k:["주택수","세법","청약기준"],a:"세 가지 기준에서 각각 내 주택 수가 몇 채로 잡히는지 정리",q:"오피스텔은 어느 기준에서 주택으로 잡히나?"}
,{t:"공동명의 vs 단독명의",b:"종부세·양도세는 공동명의가 유리한 경우가 많지만, 대출과 청약에서는 불리할 수 있습니다.",k:["공동명의","지분","세부담"],a:"내 상황에서 공동명의의 장단점을 표로 정리하고 잠정 결론 내리기",q:"내가 공동명의를 택한다면 지분 비율은?"}
,{t:"규제 최신 확인 루틴 만들기",b:"부동산 제도는 6개월이면 바뀝니다. '어디서 확인하는지'를 아는 게 지식보다 오래갑니다.",k:["정보출처","공식사이트","개정확인"],a:"대출·세금·청약·규제지역을 확인할 공식 사이트 4곳을 북마크하고 카드에 링크로 저장",q:"내가 가장 자주 봐야 할 사이트 1곳은?"}
,{t:"[3단계 졸업시험] 내가 살 수 있는 집",b:"자금·대출·세금·비용을 모두 반영해 실제 상한선을 뽑습니다. 여기서 나온 숫자가 12월 기준서의 뼈대예요.",k:["예산상한","실행가능성"],a:"'내가 지금 살 수 있는 최대 집값'과 '무리 없이 살 수 있는 적정 집값' 두 숫자를 근거와 함께 산출해 카드 저장",q:"두 숫자의 차이는 얼마이고 왜 생겼나?"}
,{t:"[4단계] 임장 전 손품",b:"현장 가기 전에 서류·시세·수급을 다 끝내야 합니다. 준비 없는 임장은 그냥 산책이에요.",k:["손품","사전조사","임장준비"],a:"이번 주 갈 임장 지역 1곳을 정하고, 후보 단지 3곳의 사전 조사표를 완성",q:"현장에서만 확인 가능한 항목은 무엇인가?"}
,{t:"내 임장 체크리스트 만들기",b:"남의 체크리스트를 베끼지 말고 내 기준으로 만드세요. 쓰면서 계속 고쳐 나갈 겁니다.",k:["체크리스트","현장확인","기록"],a:"단지 외부/내부/주변/중개소 4개 영역으로 나눈 30개 항목 체크리스트를 만들어 인쇄 또는 카드 저장",q:"내 체크리스트에서 배점이 가장 높은 항목은?"}
,{t:"중개사무소에서 쓰는 말",b:"'그냥 보러 왔어요'는 최악입니다. 예산·시기·조건을 명확히 말해야 진짜 매물을 보여줘요.",k:["중개사","브리핑","조건제시"],a:"중개사에게 할 첫 3문장과, 반드시 물어볼 질문 10개를 대본으로 써두기",q:"중개사가 내 편이 아닐 수 있는 순간은 언제?"}
,{t:"집 안에서 볼 20가지",b:"수압·환기·수납·콘센트 위치·창밖 소음까지. 감탄하지 말고 체크리스트를 손에 들고 보세요.",k:["내부점검","수압","채광"],a:"내부 점검 20항목을 확정하고, 각 항목을 어떻게 확인할지 방법까지 적기",q:"물을 틀어봐야 하는 곳은 어디어디인가?"}
,{t:"하자 알아보기 — 누수·결로·곰팡이",b:"벽지 들뜸, 몰딩 얼룩, 창틀 곰팡이는 겨울에 특히 잘 보입니다. 11~12월 임장의 장점이에요.",k:["누수","결로","곰팡이","단열"],a:"하자 사진 예시를 검색해 눈에 익히고, 하자 발견 시 협상 문구 3개 준비",q:"결로와 누수는 어떻게 구분하나?"}
,{t:"소음·창호·단열 실측",b:"창을 닫고 30초 서 있어보고, 창틀을 손으로 만져보세요. 이중창 여부와 새시 연식이 겨울 난방비를 정합니다.",k:["이중창","새시","층간소음"],a:"관심 매물의 새시 종류와 교체 여부를 확인할 질문지를 만들고, 교체 비용 시세도 조사",q:"새시 전체 교체 비용은 대략 얼마인가?"}
,{t:"[주간점검] 실제 임장 1건",b:"오늘은 읽는 날이 아니라 나가는 날입니다. 준비한 체크리스트를 실제로 써보세요.",k:["현장임장","실행"],a:"관심 단지 1곳에 직접 가서 체크리스트를 채우고, 중개사무소 최소 2곳 방문 후 기록을 카드로 저장",q:"손품과 실제가 가장 달랐던 점은?"}
,{t:"임장 기록을 자산으로 만들기",b:"기억은 3일이면 흐려집니다. 같은 양식으로 쌓인 기록만이 비교를 가능하게 해요.",k:["임장노트","표준양식","사진관리"],a:"임장 기록 표준 양식(날짜·단지·가격·장점3·단점3·점수·사진)을 만들고 어제 임장을 이 양식으로 재정리",q:"6개월 뒤에도 이해될 기록인가?"}
,{t:"시간대를 바꿔 다시 보기",b:"평일 낮과 금요일 밤의 동네는 다른 곳입니다. 최소 2개 시간대는 봐야 해요.",k:["시간대별","주차현황","야간"],a:"이미 본 단지를 다른 시간대에 다시 방문(또는 계획을 캘린더에 등록)하고 차이점 3가지 기록",q:"밤에만 보이는 문제는 무엇이었나?"}
,{t:"적정 가격 역산하기",b:"주변 실거래·층향 보정·하자 감액을 반영해 '내가 낼 수 있는 가격'을 먼저 정하고 가세요.",k:["적정가","보정","감액요인"],a:"관심 매물 1건의 적정가를 계산식으로 산출하고, 호가와의 차이를 확인",q:"내 계산이 호가보다 낮다면 그 이유는?"}
,{t:"매도자 사정 읽기",b:"이사 날짜, 매도 이유, 매물 등록 기간은 협상력의 원천입니다. 오래 안 팔린 매물이 기회예요.",k:["매도사유","등록기간","급매"],a:"관심 매물의 등록 경과일과 가격 변동 이력을 조사하고, 중개사에게 물어볼 질문 만들기",q:"급매의 진짜 조건은 무엇인가?"}
,{t:"협상 스크립트 쓰기",b:"'좀 깎아주세요'는 안 통합니다. 근거(하자·시세·조건)를 붙인 구체적 숫자를 제시해야 해요.",k:["협상","근거제시","조건교환"],a:"가격 대신 내줄 수 있는 카드(잔금일·수리 미요구 등)를 정리하고 협상 대본 1장 작성",q:"내가 절대 양보 못 할 조건은?"}
,{t:"가계약금의 함정",b:"계좌로 보낸 가계약금은 계약 성립으로 인정될 수 있습니다. 문자로 조건을 남기고 보내세요.",k:["가계약금","해약금","계약금배액"],a:"가계약금 송금 전 문자로 남길 조건 문구(금액·특약·해제조건) 템플릿 작성",q:"가계약금을 돌려받을 수 있는 경우는?"}
,{t:"[주간점검] 협상 롤플레이",b:"입으로 해봐야 실전에서 나옵니다. 혼자서라도 소리 내어 연습하세요.",k:["롤플레이","실전연습"],a:"준비한 대본으로 협상 상황을 소리 내어 3번 연습하고, 막히는 질문 5개를 찾아 답변 보강",q:"가장 대답하기 어려웠던 질문은?"}
,{t:"매매계약서 조항 해부",b:"표준계약서의 모든 줄에는 이유가 있습니다. 한 번은 처음부터 끝까지 정독해야 해요.",k:["표준계약서","계약금","위약금"],a:"국토부 표준 매매계약서를 내려받아 전 조항을 읽고, 이해 안 되는 조항 5개를 정리해 뜻 찾기",q:"계약 해제 시 위약금은 어떻게 되나?"}
,{t:"특약이 계약을 지킨다",b:"본문은 다 비슷하고, 진짜 차이는 특약에서 납니다. 내가 원하는 조건은 반드시 특약에 쓰세요.",k:["특약","하자담보","잔금조건"],a:"내가 넣고 싶은 특약 10개를 문장으로 써서 저장(등기부 동일성 유지, 하자 처리, 대출 미승인 시 해제 등)",q:"대출이 안 나오면 계약을 해제할 수 있는 특약을 어떻게 쓸까?"}
,{t:"계약금·중도금·잔금 설계",b:"중도금이 오가면 단순 변심으로 해제가 어려워집니다. 일정 설계가 곧 리스크 관리예요.",k:["계약금","중도금","잔금일"],a:"내 상황에 맞는 대금 일정표를 만들고, 대출 실행일과 이사일까지 한 캘린더에 배치",q:"중도금을 넣는 것이 나에게 유리한가?"}
,{t:"잔금일 체크리스트",b:"등기부 재확인, 관리비 정산, 열쇠 인수, 시설 상태 확인을 한 자리에서 끝내야 합니다.",k:["잔금","정산","인수인계"],a:"잔금일 당일 순서대로 할 일 15개를 시간표로 만들어 저장",q:"잔금 직전 등기부를 다시 떼는 이유는?"}
,{t:"소유권이전등기",b:"법무사에게 맡기든 셀프로 하든 절차를 알아야 사고를 막습니다. 잔금과 등기 신청은 같은 날이어야 해요.",k:["소유권이전","법무사","등기신청"],a:"소유권이전등기 필요 서류 목록과 셀프 등기 절차를 정리하고, 법무사 비용 견적 2곳 비교",q:"등기가 늦어지면 어떤 위험이 있나?"}
,{t:"이사 후 행정 처리",b:"전입신고, 취득세 신고·납부, 관리사무소 등록까지 기한이 있습니다. 놓치면 가산세가 붙어요.",k:["전입신고","취득세신고","기한"],a:"이사 후 30일 안에 해야 할 일을 기한과 함께 체크리스트로 만들기",q:"취득세 신고 기한은 며칠인가?"}
,{t:"[주간점검] 모의 계약서 작성",b:"실제 양식에 내 조건을 채워보면 빈틈이 보입니다. 오늘 만든 문서를 실전에서 그대로 쓸 거예요.",k:["모의계약","특약","검토"],a:"표준계약서에 내 관심 매물 조건과 특약 10개를 실제로 채워 완성본을 만들고 카드 저장",q:"다시 읽어보니 빠진 조항이 있나?"}
,{t:"세입자가 있는 집 사기",b:"임차인의 대항력·계약 기간·갱신청구권이 내 입주 계획을 좌우합니다. 실거주 목적이면 특히 조심하세요.",k:["임차인승계","갱신거절","실거주"],a:"세입자 낀 매물을 살 때 확인할 항목과 필요한 서면 동의 내용을 정리",q:"내가 실거주하려면 언제까지 통보해야 하나?"}
,{t:"경매 맛보기 — 권리분석",b:"말소기준권리보다 앞선 권리는 내가 떠안습니다. 이 한 문장이 경매 권리분석의 핵심이에요.",k:["말소기준권리","인수","소멸"],a:"경매 사이트에서 물건 1건을 골라 등기부상 권리를 시간순으로 나열하고 인수/소멸 판정해보기",q:"말소기준권리가 될 수 있는 권리는 무엇들인가?"}
,{t:"공매·급매·NPL 구분",b:"경매는 법원, 공매는 캠코입니다. 급매는 그냥 싸게 나온 일반 매물이고요. 각각 위험의 종류가 달라요.",k:["공매","온비드","급매"],a:"세 가지 취득 경로의 절차·위험·필요 자금을 표로 비교",q:"초보에게 가장 안전한 경로는 무엇이고 왜?"}
,{t:"재건축 기초",b:"안전진단→조합설립→사업시행인가→관리처분→이주·철거→준공. 단계마다 리스크와 가격이 달라집니다.",k:["안전진단","조합설립","관리처분인가"],a:"관심 재건축 단지 1곳의 현재 단계를 확인하고, 남은 단계와 예상 소요 기간 적기",q:"어느 단계부터 가격이 크게 뛰나?"}
,{t:"재개발 기초",b:"재개발은 동네 전체를 바꿉니다. 감정평가액과 분담금 계산이 핵심이고, 초보에겐 난이도가 높아요.",k:["감정평가액","비례율","분담금"],a:"비례율과 분담금 계산식을 정리하고, 실제 사례 1건으로 계산해보기",q:"비례율이 100% 미만이면 무슨 뜻인가?"}
,{t:"리모델링 사업",b:"재건축이 어려운 단지의 대안입니다. 용적률 여유가 없어도 가능하지만 증가 세대수가 적어요.",k:["리모델링","수직증축","안전성검토"],a:"재건축과 리모델링의 조건·기간·수익성 차이를 표로 정리",q:"우리 관심 단지는 어느 쪽이 유리한가?"}
,{t:"[주간점검] 정비사업 단지 분석",b:"기대감으로 오른 가격과 실제 사업성은 다릅니다. 숫자로 검증해보세요.",k:["사업성","분담금","리스크"],a:"관심 정비사업 단지 1곳: 단계·조합원수·예상 분담금·주변 신축 시세를 조사해 사업성 판단 리포트 작성",q:"이 사업이 엎어진다면 이유는 무엇일까?"}
,{t:"오피스텔·생숙의 함정",b:"주거용 오피스텔은 주택 수에 잡히고, 생활형숙박시설은 전입신고가 안 됩니다. 광고만 보면 안 돼요.",k:["주거용오피스텔","생활형숙박시설","업무시설"],a:"오피스텔·생숙·도시형생활주택의 세금·대출·전입 가능 여부를 표로 비교",q:"생숙에 주민등록을 옮길 수 있나?"}
,{t:"빌라 매수의 위험",b:"시세 기준이 불명확하고 환금성이 낮습니다. 신축 빌라 분양가는 특히 거품이 끼기 쉬워요.",k:["환금성","신축빌라","시세불투명"],a:"관심지역 빌라의 실거래가 편차를 조사해 같은 면적 최고·최저 차이를 확인",q:"빌라를 산다면 어떤 조건이어야 할까?"}
,{t:"상가 기초 — 수익률 계산",b:"수익률=(연임대료-비용)÷투자금. 공실 한 달이 수익률을 통째로 깎습니다.",k:["임대수익률","공실률","권리금"],a:"가상의 상가(투자금 3억, 월세 120만) 수익률을 계산하고, 공실 3개월 시 수익률 변화 확인",q:"주거용 대비 상가의 가장 큰 위험은?"}
,{t:"부동산 사기 유형 정리",b:"이중계약, 대리인 사칭, 신탁 물건 무단임대, 깡통전세. 패턴을 알면 대부분 막을 수 있어요.",k:["이중계약","대리계약","위임장"],a:"사기 유형 6가지와 각각의 예방 체크포인트를 카드로 정리",q:"대리인과 계약할 때 반드시 확인할 것은?"}
,{t:"문제가 생겼을 때",b:"내용증명, 임대차분쟁조정위원회, 지급명령, 소송 순서로 갑니다. 증거를 남기는 습관이 먼저예요.",k:["내용증명","분쟁조정위원회","지급명령"],a:"내용증명 양식을 구해 가상의 상황으로 한 장 써보기",q:"계약 과정에서 어떤 기록을 남겨야 하나?"}
,{t:"실패 사례 스터디",b:"성공담보다 실패담이 더 많이 가르칩니다. 남의 손해로 배우는 게 가장 쌉니다.",k:["사례연구","리스크","교훈"],a:"실제 부동산 손실 사례 3건을 찾아 읽고, 각각 어느 단계에서 막을 수 있었는지 분석",q:"내가 가장 저지르기 쉬운 실수는?"}
,{t:"[4단계 졸업시험] 매물 투자보고서",b:"실제 매물 하나를 끝까지 분석합니다. 남에게 보여줘도 부끄럽지 않은 문서를 만드세요.",k:["투자보고서","종합","의사결정"],a:"실제 매물 1건: 서류·시세·입지·수급·자금·세금·리스크·결론까지 A4 5장 보고서를 완성해 카드 저장",q:"이 보고서에서 가장 자신 없는 부분은?"}
,{t:"[5단계] 기준서 — 예산",b:"이제 배운 걸 내 기준으로 굳힙니다. 첫 항목은 절대 넘지 않을 예산선이에요.",k:["예산상한","안전마진","비상금"],a:"매수 상한가, 대출 상한, 남길 비상금 3개 숫자를 확정해 적기",q:"이 숫자를 넘고 싶어질 상황은 언제일까?"}
,{t:"기준서 — 지역 3곳",b:"관심지역을 3곳으로 좁힙니다. 많으면 아무것도 못 봅니다.",k:["타깃지역","우선순위"],a:"지금까지의 점수표를 근거로 지역 3곳을 확정하고 각각 선정 이유 3줄씩 쓰기",q:"탈락시킨 지역의 탈락 사유는 무엇인가?"}
,{t:"기준서 — 절대 안 되는 조건",b:"살 이유보다 안 살 이유가 나를 더 잘 지켜줍니다. 예외 없는 금지 목록을 만드세요.",k:["배제기준","레드플래그"],a:"'이건 아무리 싸도 안 산다' 조건 7개를 확정(예: 선순위 채권 과다, 위반건축물, 세대당 주차 0.5대 미만 등)",q:"이 목록에 예외를 두고 싶은 항목이 있나?"}
,{t:"기준서 — 타이밍",b:"'언제 살 것인가'를 조건문으로 적어두면 뉴스에 흔들리지 않습니다.",k:["매수타이밍","트리거","조건문"],a:"'A와 B가 동시에 만족되면 산다' 형식으로 매수 트리거 3개를 작성",q:"내 트리거가 지금 몇 개 충족되어 있나?"}
,{t:"기준서 — 대출 원칙",b:"한도까지 다 쓰는 사람이 가장 먼저 흔들립니다. 소득 대비 상환 비율 상한을 못 박으세요.",k:["상환비율","금리스트레스","여유"],a:"월 상환액 상한을 소득 대비 %로 확정하고, 금리 +2%p 상황에서도 지켜지는지 검증",q:"이 원칙을 어기게 만들 유혹은 무엇일까?"}
,{t:"기준서 — 출구 전략",b:"살 때 팔 때를 정해두는 게 프로입니다. 언제·왜 팔지를 미리 적으세요.",k:["출구전략","보유기간","손절"],a:"보유 목표 기간, 매도 조건, 최악의 경우 대응책을 각각 문장으로 작성",q:"손실이 났을 때 나는 어떻게 행동할 것인가?"}
,{t:"[주간점검] 기준서 v1 완성",b:"6개 항목을 한 문서로 합칩니다. 이게 5개월 공부의 결과물이에요.",k:["기준서","문서화"],a:"예산·지역·배제·타이밍·대출·출구 6장을 한 문서로 합쳐 '나의 매수 기준서 v1'을 완성하고 카드 저장",q:"이 기준서를 6개월 뒤에도 지킬 수 있을까?"}
,{t:"후보 매물 10건 뽑기",b:"기준서를 필터로 써서 실제 매물을 걸러봅니다. 기준이 좋으면 10건이 금방 추려져요.",k:["스크리닝","필터","후보군"],a:"기준서 조건을 적용해 실제 시장에서 후보 매물 10건을 리스트업(단지·평형·호가·특징)",q:"기준에 걸려 탈락한 매물이 몇 건이었나?"}
,{t:"스코어링 표 만들기",b:"항목별 점수와 가중치로 매물을 줄 세웁니다. 감정이 끼어들 자리를 줄이는 장치예요.",k:["스코어링","가중치","랭킹"],a:"10개 항목 × 가중치로 100점 만점 평가표를 만들고 후보 10건을 전부 채점",q:"1위와 10위의 점수 차이는 얼마인가?"}

/* ---- 오늘의 부동산 공부 · 이슈 ---- */
function FEEDGET(p,d){try{return p.split(".").reduce((a,k)=>a[k],FEED);}catch(e){return d;}}
function esDay(){return eStudyD||todayStr();}
function eIdx(k){
  const b=Date.UTC(2026,6,27),d=Date.parse(k+"T00:00:00Z");
  let n=Math.round((d-b)/86400000);
  if(!isFinite(n)||n<0) n=0;
  if(n>=CURRI.length){const st=98;n=st+((n-st)%(CURRI.length-st));}
  return n;
}
function ePhase(day){
  for(let i=0;i<PHASES.length;i++){const p=PHASES[i];if(day>=p.s&&day<=p.e)return{i:i+1,s:p.s,e:p.e,n:p.n,d:p.d};}
  const l=PHASES[PHASES.length-1];return{i:PHASES.length,s:l.s,e:l.e,n:l.n,d:l.d};
}
function eIsRev(st){return /점검|시험/.test((st&&st.t)||"");}
function missionToTodo(){
  const st=eStudy(esDay()),s=ds(),t=todayStr();
  const cats=s.cats||[];
  const c=cats.filter(x=>/공부|루틴/.test(x.name||""))[0]||cats[0];
  if(!c){try{toast("데일리 카테고리가 없어요");}catch(e){}return;}
  if(!s.days)s.days={};if(!s.days[t])s.days[t]=[];
  const tx="🏠 "+(st.a||st.t);
  if(s.days[t].some(x=>x.text===tx)){try{toast("이미 오늘 투두에 있어요");}catch(e){}return;}
  s.days[t].push({id:uid(),cat:c.id,part:"pm",text:tx,done:false,roll:0,from:"",rt:""});
  save();try{toast("✅ 오늘 투두에 넣었어요");}catch(e){}render();
}
function eStudy(k){
  const f=FEEDGET("estate."+k+".study",null);
  return f||CURRI[eIdx(k)];
}
function eNews(k){return FEEDGET("estate."+k+".news",null)||[];}
function eRead(){const s=DATA.estate;s.read=s.read||{};return s.read;}
function togRead(){
  const k=esDay(),r=eRead();
  if(r[k])delete r[k];else r[k]=1;
  save();render();
}
function eStreak(){
  const r=eRead();let n=0,c=todayStr();
  while(r[c]){n++;c=addDays(c,-1);}
  return n;
}
function eShift(n){
  const k=addDays(esDay(),n);
  if(k>todayStr())return;
  eStudyD=k;render();
}
function studyToCard(){
  const k=esDay(),st=eStudy(k);
  const o={id:uid(),title:st.t,tag:"기초",status:"진행중",progress:0,due:"",owner:"",
    goal:(st.a||""),desc:(st.b||"")+(st.q?"\n\n[스스로 답해보기] "+st.q:""),
    todos:(st.k||[]).map(x=>({id:uid(),text:x+" 뜻 내 말로 정리",done:false})).concat(st.q?[{id:uid(),text:"❓ "+st.q,done:false}]:[]),
    milestones:[],links:[],logs:[],quotes:[],note:"📚 "+k+" 오늘의 공부에서 저장"};
  DATA.estate.items.unshift(o);save();render();
}
function estatePanel(){
  const k=esDay(),st=eStudy(k),nw=eNews(k),r=eRead()[k],today=todayStr();
  const no=k===today?1:0;
  const dno=eIdx(k)+1,ph=ePhase(dno),rev=eIsRev(st);
  const tot=Math.round(dno/CURRI.length*100),left=Math.max(0,CURRI.length-dno);
  const terms=(st.k||[]).map(x=>`<span class="term">${esc(x)}</span>`).join("");
  const news=nw.length?nw.map(n=>`<div class="nitem">
      <div class="nt">${n.u?`<a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.t)} ↗</a>`:esc(n.t)}</div>
      <div class="ns">${esc(n.s||"")}</div>
      ${n.w?`<div class="nw">💡 ${esc(n.w)}</div>`:""}</div>`).join("")
    :`<div class="nempty">아직 오늘 뉴스가 없어요. 매일 오전 9시에 클로드가 채워둡니다.</div>`;
  return `<div class="studybox">
    <div class="sbhead">
      <button class="btn sm" onclick="eShift(-1)">‹ 어제</button>
      <div class="sbd">${korDate(k)}${k===today?`<span class="tdbadge">오늘</span>`:""}</div>
      <button class="btn sm" ${no?"disabled":""} onclick="eShift(1)">내일 ›</button>
      <span class="strk">🔥 ${eStreak()}일 연속</span>
    </div>
    <div class="sbmain">
      <div class="sblab">📚 ${esc(ph.n)} <span class="dno">${dno}<em>/${CURRI.length}일</em></span>${rev?`<span class="revb">점검일</span>`:""}</div>
      <div class="pgw"><i style="width:${tot}%"></i></div>
      <div class="pgt">${esc(ph.d)} · 졸업까지 <b>${left}일</b></div>
      <h3>${esc(st.t)}</h3>
      <p>${esc(st.b)}</p>
      ${terms?`<div class="terms">${terms}</div>`:""}
      ${st.a?`<div class="todoline${rev?" rev":""}">🎯 오늘의 미션 — ${esc(st.a)}</div>`:""}
      ${st.q?`<div class="qline">❓ 스스로 답해보기 — ${esc(st.q)}</div>`:""}
      <div class="sbacts">
        <button class="btn sm ${r?"primary":""}" onclick="togRead()">${r?"✓ 완료":"완료 표시"}</button>
        <button class="btn sm ghost" onclick="missionToTodo()">투두에 넣기</button>
        <button class="btn sm ghost" onclick="studyToCard()">카드로 저장</button>
      </div>
    </div>
    <div class="sbnews"><div class="sblab">📰 오늘의 부동산 이슈</div>${news}</div>
  </div>`;
}

const WPAT=[
 {d:0,tag:"시리즈",t:["{x} 시리즈 EP.{n} — {p}에서","혼자 떠난 {p}, 1박 2일 기록","{p}에서 보낸 토요일 아침"],
  h:["둘이 하던 걸 혼자 해봤습니다","이번엔 진짜 아무도 없었어요","도망친 곳에도 낙원은 있더라"]},
 {d:2,tag:"사진",t:["요즘 나의 {p} 루틴","퇴근하고 {x} 해봤어요","요즘 나를 살리는 것 3가지"],
  h:["일 잘하는 사람일수록 잘 쉽니다","오늘도 로그아웃 성공","버티는 게 아니라 고르는 중"]},
 {d:4,tag:"릴스",t:["{x} 하는 사람들의 공통점","주말 시작 전 딱 1분만","이번 주 나를 웃게 한 장면"],
  h:["저장해두고 금요일마다 보세요","이거 모르면 주말이 사라집니다","3초만 보고 가세요"]}
];
const WX=["캠핑","혼밥","산책","커피","독서","드라이브","정리","달리기"];
const WP=["근교","동네","바다 앞","숲속","카페","집"];
function wkOf(k){const d=new Date(k+"T00:00:00");return Math.floor(d.getTime()/604800000);}
function genWeek(){
  const s=ms(),ws=weekStart(todayStr()),n=wkOf(ws);
  const ep=((s.items||[]).filter(i=>/EP\./.test(i.title)).length)+1;
  const slots=WPAT.map((p,i)=>{
    const pick=a=>a[(n+i)%a.length];
    const t=pick(p.t).replace("{n}",String(ep+i>9?ep:"0"+(ep))).replace("{x}",WX[(n+i)%WX.length]).replace("{p}",WP[(n+i*2)%WP.length]);
    return {id:uid(),d:addDays(ws,p.d),tag:p.tag,title:t,hook:pick(p.h),note:"",made:false};
  });
  s.week={start:ws,src:"auto",made:todayStr(),slots:slots};
  save();render();
}
function slotCard(id){
  const s=ms(),sl=(s.week&&s.week.slots||[]).find(x=>x.id===id); if(!sl)return;
  const o={id:uid(),title:sl.title,tag:sl.tag||(s.tags||[])[0]||"릴스",status:"기획",progress:0,
    start:todayStr(),due:sl.d,owner:"",hook:sl.hook||"",concept:sl.note||"",cta:"",hashtags:"",
    url:"",stats:{views:0,likes:0,comments:0,saves:0,shares:0,follows:0},
    todos:[{id:uid(),text:"촬영",done:false},{id:uid(),text:"편집",done:false},{id:uid(),text:"업로드",done:false}],
    milestones:[],links:[],logs:[],quotes:[],desc:"",goal:"",note:""};
  s.items.unshift(o);sl.made=true;save();render();openDetail(o.id);
}
function delSlot(id){
  const s=ms();if(!s.week)return;
  s.week.slots=(s.week.slots||[]).filter(x=>x.id!==id);save();render();
}
function weekBox(){
  const s=ms(),ws=weekStart(todayStr()),w=s.week;
  const fresh=w&&w.start===ws;
  const body=(fresh&&(w.slots||[]).length)?w.slots.map(sl=>`<div class="wslot ${sl.made?"done":""}">
      <div class="wsd">${korDate(sl.d).replace(/^\d+년 /,"")}<span>${esc(sl.tag||"")}</span></div>
      <div class="wsb"><b>${esc(sl.title)}</b>${sl.hook?`<i>“${esc(sl.hook)}”</i>`:""}</div>
      <div class="wsa">${sl.made?`<span class="madeb">카드 생성됨</span>`
        :`<button class="btn sm primary" onclick="slotCard('${sl.id}')">카드로 만들기</button>`}
        <button class="x" onclick="delSlot('${sl.id}')">✕</button></div>
    </div>`).join("")
    :`<div class="nempty">이번 주 스케줄이 아직 없어요. 매주 월요일 오전 9시에 클로드가 만들어 두거나, 아래 버튼으로 바로 뽑을 수 있어요.</div>`;
  const src=fresh?(w.src==="claude"?"🤖 클로드 자동 생성":"⚙ 자동 생성"):"";
  return `<div class="weekbox">
    <div class="wbh">🗓 이번 주 콘텐츠 스케줄 <span class="wbd">${ws.slice(5)} ~ ${addDays(ws,6).slice(5)}</span>
      <span class="wbsrc">${src}</span>
      <button class="btn sm" onclick="genWeek()">＋ 이번 주 자동 생성</button></div>
    ${body}</div>`;
}

/* --- 비밀 탭: 꿈 보드 --- */
let dreamOn=false, logoTaps=[], dreamPick=null;
function dm(){return DATA.dream||(DATA.dream={label:"🌙 꿈",type:"dream",secret:true,tags:[],items:[]});}
function logoTap(){
  const t=Date.now();
  logoTaps=logoTaps.filter(x=>t-x<1400);logoTaps.push(t);
  if(logoTaps.length>=3){
    logoTaps=[];
    if(dreamOn){dreamOn=false;if(cur==="dream")cur="project";renderTabs();render();toast("🔒 비밀 탭을 숨겼어요");}
    else{dreamOn=true;dm();renderTabs();go("dream");toast("🌙 비밀 탭이 열렸어요");}
  }
}
function toast(msg){return toastU(msg,null);}
function toastU(msg,undoFn){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}
  el.innerHTML="";
  const sp=document.createElement("span");sp.className="tmsg";sp.textContent=msg;el.appendChild(sp);
  if(undoFn){
    const b=document.createElement("button");
    b.type="button";b.className="tundo";b.textContent="↩ 되돌리기";
    b.setAttribute("aria-label","방금 삭제한 항목 되돌리기");
    b.onclick=function(){el.className="";clearTimeout(toast._t);try{undoFn();}catch(e){}};
    el.appendChild(b);
  }
  el.className=undoFn?"on hasu":"on";
  clearTimeout(toast._t);

function dreamFile(el){
  const fs=[...(el.files||[])];

  const room=DMAX-dreamPick.length;
  if(room<=0){alert("사진은 최대 "+DMAX+"장까지예요.");el.value="";return;}
  const use=fs.slice(0,room);
  if(fs.length>room)alert("최대 "+DMAX+"장이라 "+room+"장만 넣었어요.");
  let left=use.length;
  use.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const M=860,sc=Math.min(1,M/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let out="";
        try{out=c.toDataURL("image/webp",0.7);}catch(err){out="";}
        if(!out||out.indexOf("image/webp")<0)out=c.toDataURL("image/jpeg",0.74);
        dreamPick.push(out);
        if(!--left){dPaint();}
      };
      img.onerror=()=>{if(!--left)dPaint();};
      img.src=e.target.result;
    };
    r.onerror=()=>{if(!--left)dPaint();};
    r.readAsDataURL(f);
  });

}

function ui(){ if(!DATA.__ui)DATA.__ui={}; return DATA.__ui; }
function weekKeyNow(){ return weekStart(todayStr()); }
function oneLine(){ const u=ui(); return (u.one&&u.one.d===todayStr())?(u.one.t||""):""; }

function renderToday(){
  const el=document.getElementById("todayline"); if(!el)return;
  const o=oneLine(), f=focusLine();
  el.innerHTML=
    '<button type="button" class="tl one" onclick="editOne()" aria-label="오늘의 한 문장 쓰기">'+
      '<i class="tld"></i><span class="tlk">오늘의 한 문장</span>'+
      '<span class="tlv '+(o?"":"ph")+'">'+(o?esc(o):"오늘 나에게 해주고 싶은 말은?")+'</span><span class="tle">✎</span></button>'+
    '<button type="button" class="tl wk" onclick="editFocus()" aria-label="이번 주의 중심 쓰기">'+
      '<i class="tld"></i><span class="tlk">이번 주의 중심</span>'+
      '<span class="tlv '+(f?"":"ph")+'">'+(f?esc(f):"이번 주에 제일 중요한 하나")+'</span><span class="tle">✎</span></button>';
}
function editOne(){ tlEdit("one"); }
function editFocus(){ tlEdit("wk"); }
function tlEdit(kind){
  const el=document.getElementById("todayline"); if(!el)return;
  const btn=el.querySelector(kind==="one"?".tl.one":".tl.wk"); if(!btn||btn.querySelector("input"))return;
  const old=kind==="one"?oneLine():focusLine();
  const sp=btn.querySelector(".tlv"); if(!sp)return;
  const inp=document.createElement("input");
  inp.type="text"; inp.className="tlin"; inp.value=old; inp.maxLength=60;
  inp.setAttribute("autocomplete","off");
  inp.setAttribute("aria-label",kind==="one"?"오늘의 한 문장":"이번 주의 중심");
  sp.textContent=""; sp.className="tlv"; sp.appendChild(inp);
  inp.focus(); try{inp.setSelectionRange(old.length,old.length);}catch(e){}
  let closed=false;
  const commit=function(ok){
    if(closed)return; closed=true;
    const v=(inp.value||"").trim();
    if(ok&&v!==old){
      const u=ui();
      if(kind==="one")u.one={d:todayStr(),t:v}; else u.wk={k:weekKeyNow(),t:v};
      save(); try{toast(v?"✎ 적어뒀어요":"지웠어요");}catch(e){}
    }
    renderToday();
  };
  inp.onkeydown=function(e){
    if(e.key==="Enter"){e.preventDefault();commit(1);}
    else if(e.key==="Escape"){e.preventDefault();commit(0);}
  };
  inp.onblur=function(){commit(1);};
}

function inboxBox(){

function inboxDel(x){
  const l=inbox(); if(!l[x])return;

  toastU("🗑 메모를 지웠어요",function(){
    const b=inbox(); b.splice(Math.min(x,b.length),0,gone); save();render();toast("↩ 되돌렸어요");
  });
}
function inboxToCard(x){
  const l=inbox(); if(!l[x])return;
  const s=DATA[cur];
  if(!s||!s.items||["daily","habit","dream","muse"].indexOf(s.type)>=0){
    alert("업무·독서·부동산처럼 카드로 쓰는 탭에서 옮겨주세요.");return;
  }
  const gone=l[x];
  s.items.unshift({id:uid(),title:gone.t,tag:(s.tags||[])[0]||"",status:statusList()[0]||"",

/* ---- 더보기 메뉴 ---- */
function toggleMore(e){
  if(e&&e.stopPropagation)e.stopPropagation();
  const w=document.getElementById("gearWrap"),b=document.getElementById("btnMore");
  if(!w)return;
  const on=!w.classList.contains("open");
  w.classList.toggle("open",on);
  if(b)b.setAttribute("aria-expanded",on?"true":"false");
}
function closeMore(){
  const w=document.getElementById("gearWrap"),b=document.getElementById("btnMore");
  if(w)w.classList.remove("open");
  if(b)b.setAttribute("aria-expanded","false");
}
try{
  document.addEventListener("click",function(e){
    const w=document.getElementById("gearWrap");
    if(w&&w.classList.contains("open")&&!w.contains(e.target))closeMore();
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape")closeMore(); });
}catch(e){}

/* ---- 통계에 붙는 한 줄 ---- */
function statSay(){
  const s=DATA[cur];
  try{
    if(s.type==="habit"){
      const st=monthStats(calY,calM);
      return st.cnt?("몸을 챙긴 날이 <b>"+st.days+"일</b>. 생각보다 많이 해냈어요."):"이번 달 첫 기록을 남겨볼까요? 15분도 충분해요.";
    }
    if(s.type==="dream"){
      const t=s.items||[];
      return t.length?("적어둔 꿈 <b>"+t.length+"개</b>. 말로 꺼낸 것만으로도 반은 온 거예요."):"여기엔 아무한테도 못 한 이야기를 적어요.";
    }
    if(s.type==="muse"){
      const a=museAgg();
      return a.upM?("이번 달 <b>"+a.upM+"개</b>를 세상에 내보냈어요."):"기획만 있어도 괜찮아요. 시작은 늘 거기서예요.";
    }
    const its=s.items||[];
    if(!its.length) return "아직 비어 있어요. 한 줄부터 가볍게 적어봐요.";
    const done=its.filter(function(i){return i.status==="완료";}).length;
    if(done) return "여기서만 <b>"+done+"개</b>를 끝냈어요. 잘 쌓이고 있어요.";
    return "시작해둔 게 <b>"+its.length+"개</b>. 오늘은 하나만 밀어볼까요?";
  }catch(e){return "";}
}

  const on=ui().statOpen===true;
  return '<button type="button" class="statmore" aria-expanded="'+(on?"true":"false")+'" onclick="statsMore()">'+(on?"통계 접기 ▴":"통계 더보기 ▾")+'</button>';

function saveEdit(){
  const tag=document.getElementById("mSave").getAttribute("data-ns");
  if(tag){
    if(tag==="rt")return saveRoutine();
    if(tag==="north")return saveNorth();
    if(tag.indexOf("q")===0)return saveQ(+tag.slice(1));
    if(tag.indexOf("goal:")===0)return saveGoal(tag.slice(5));
    if(tag.indexOf("dream:")===0)return saveDream(tag.slice(6));
  }
  const s=DATA[cur],g=id=>document.getElementById(id);
  const title=(g("f_title").value||"").trim();
  if(!title){alert("제목을 입력해주세요.");return;}
  const isNew=!editing;
  const o=editing||{id:uid()};
  o.title=title;o.tag=g("f_tag")?g("f_tag").value:"";o.note=g("f_note").value;
  {
    o.status=g("f_status").value;o.progress=Math.max(0,Math.min(100,+g("f_progress").value||0));
    o.start=g("f_start").value;o.due=g("f_due").value;o.goal=g("f_goaltext").value;
    o.todos=o.todos||[];o.milestones=o.milestones||[];o.links=o.links||[];o.logs=o.logs||[];o.desc=o.desc||"";o.owner=o.owner||"";
  }
  if(isNew) s.items.unshift(o);
  closeEdit();render();
}

function applyNote(el){
  if(!el)return;
  if(el.id!=="f_note"){const i=find(detailId);if(i){i.note=el.value;save();}}
  const pv=document.getElementById("pv_"+el.id);
  if(pv){const h=hlHtml(el.value);
    pv.innerHTML=h?h:'<span class="pvph">칠한 부분이 여기에 노랗게 보여요</span>';}
  const c=document.getElementById("noteCnt");if(c)c.textContent=(el.value||"").length+"자";
}
function noteHl(id){
  const el=document.getElementById(id);if(!el)return;
  const v=el.value,a=el.selectionStart,b=el.selectionEnd;
  if(a===b){try{toast("칠할 부분을 먼저 드래그해서 골라주세요");}catch(e){}el.focus();return;}
  let sel=v.slice(a,b);
  /* 앞뒤 공백은 칠하지 않기 */
  const lead=sel.length-sel.replace(/^\s+/,"").length;
  sel=sel.replace(/^\s+/,"");
  const tail=sel.length-sel.replace(/\s+$/,"").length;
  sel=sel.replace(/\s+$/,"");
  if(!sel){try{toast("칠할 부분을 먼저 드래그해서 골라주세요");}catch(e){}el.focus();return;}
  const A=a+lead,B=b-tail;
  let out,na,nb;
  if(/^==[\s\S]+==$/.test(sel)){out=sel.slice(2,-2);na=A;nb=A+out.length;}
  else if(v.slice(Math.max(0,A-2),A)==="=="&&v.slice(B,B+2)==="=="){
    el.value=v.slice(0,A-2)+sel+v.slice(B+2);
    el.setSelectionRange(A-2,B-2);applyNote(el);el.focus();return;
  }
  else{out="=="+sel+"==";na=A;nb=A+out.length;}
  el.value=v.slice(0,A)+out+v.slice(B);
  el.setSelectionRange(na,nb);
  applyNote(el);el.focus();
}

function editRow(btn,key,x,prop){
  const i=find(detailId);if(!i||!i[key]||!i[key][x])return;
  const row=btn.closest(".row,.qrow,.frow");if(!row)return;
  const sp=row.querySelector(".grow,.qtext");if(!sp||sp.querySelector("input"))return;
  const old=String(i[key][x][prop]==null?"":i[key][x][prop]);
  const inp=document.createElement("input");
  inp.type="text";inp.className="rowin";inp.value=old;
  inp.setAttribute("autocomplete","off");inp.setAttribute("aria-label","내용 수정");
  sp.textContent="";sp.appendChild(inp);
  inp.focus();try{inp.setSelectionRange(old.length,old.length);}catch(e){}
  let closed=false;
  const commit=ok=>{
    if(closed)return;closed=true;
    const v=(inp.value||"").trim();
    if(ok&&v&&v!==old){i[key][x][prop]=v;save();try{toast("✎ 고쳤어요");}catch(e){}}
    renderDetail();
  };
  inp.onkeydown=e=>{
    if(e.key==="Enter"){e.preventDefault();commit(1);}
    else if(e.key==="Escape"){e.preventDefault();commit(0);}
  };
  inp.onblur=()=>commit(1);
}

const FMAXMB=2;
function fSize(n){n=+n||0;return n<1024?n+"B":(n<1048576?Math.round(n/1024)+"KB":(n/1048576).toFixed(1)+"MB");}

function addFileLink(el){
  const fs=[...(el.files||[])];el.value="";
  if(!fs.length)return;
  const i=find(detailId);if(!i)return;
  i.links=i.links||[];
  const lim=FMAXMB*1024*1024,skipped=[];
  let left=fs.length;
  const put=(f,d)=>{i.links.push({label:f.name,url:"",file:{n:f.name,t:f.type||"",s:Math.round(d.length*0.75),d:d}});};
  const done=()=>{
    save();renderDetail();
    if(skipped.length)alert("너무 커서 담지 못한 파일이 있어요 (한 개당 "+FMAXMB+"MB까지)\n\n"+skipped.join("\n"));
    else{try{toast("📎 파일을 담았어요");}catch(e){}}
  };
  fs.forEach(f=>{
    if(f.size>lim){skipped.push(f.name);if(!--left)done();return;}
    const r=new FileReader();
    r.onload=e=>{
      const d=e.target.result;
      if(/^image\//.test(f.type||"")){
        const img=new Image();
        img.onload=()=>{
          const M=1400,sc=Math.min(1,M/Math.max(img.width,img.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          let out="";try{out=c.toDataURL("image/webp",0.75);}catch(err){out="";}
          if(!out||out.indexOf("image/webp")<0){try{out=c.toDataURL("image/jpeg",0.8);}catch(err2){out="";}}
          put(f,out||d);if(!--left)done();
        };
        img.onerror=()=>{put(f,d);if(!--left)done();};
        img.src=d;
      }else{put(f,d);if(!--left)done();}
    };
    r.onerror=()=>{skipped.push(f.name);if(!--left)done();};
    r.readAsDataURL(f);
  });
}

let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;renderInstall();});
window.addEventListener("appinstalled",()=>{installEvt=null;renderInstall();try{toast("🏠 홈화면에 설치됐어요");}catch(e){}});
function isStandalone(){
  try{ if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) return true; }catch(e){}
  return window.navigator.standalone===true;
}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
function renderInstall(){
  const b=document.getElementById("btnApp");if(!b)return;
  b.style.display=(isStandalone()||(!installEvt&&!isIOS()))?"none":"";
}
function installApp(){
  if(installEvt){installEvt.prompt();installEvt=null;setTimeout(renderInstall,400);return;}
  if(isIOS()){
    alert("아이폰에서 홈화면에 추가하기\n\n1) 사파리 아래쪽 공유 버튼 (□↑) 누르기\n2) 목록에서 「홈 화면에 추가」 선택\n3) 오른쪽 위 「추가」\n\n그러면 마중 아이콘으로 앱처럼 열려요 :)");
    return;
  }
  alert("브라우저 메뉴(⋮)에서 「앱 설치」 또는 「홈 화면에 추가」를 눌러주세요.");
}

/* ================= 개인 금고 (사이트별 아이디·비밀번호) =================
   · DATA 와 완전히 분리된 별도 저장소에 보관 → 백업 파일·구글 동기화에 절대 포함되지 않음
   · PIN 으로 만든 열쇠(PBKDF2 15만회)로 AES-GCM 암호화 → PIN 없이는 내용을 알 수 없음      */
const VKEYNAME=CONFIG.storeKey+"_vault";
let VKEY=null,VSALT=null,VLIST=null,vShow={},vEdit=null,vMsg="",vTimer=null;

function vCrypto(){try{return (typeof crypto!=="undefined"&&crypto.subtle)?crypto.subtle:null;}catch(e){return null;}}
function vRaw(){try{return localStorage.getItem(VKEYNAME);}catch(e){return null;}}
function vHas(){return !!vRaw();}
function vB64(buf){let s="",a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function vBuf(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function vNewId(){return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
async function vDerive(pin,salt){
  const c=vCrypto();
  const base=await c.importKey("raw",new TextEncoder().encode(String(pin)),{name:"PBKDF2"},false,["deriveKey"]);
  return await c.deriveKey({name:"PBKDF2",salt:salt,iterations:150000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function vPersist(){
  if(!VKEY)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(VLIST||[]));
  const enc=await vCrypto().encrypt({name:"AES-GCM",iv:iv},VKEY,data);
  try{localStorage.setItem(VKEYNAME,JSON.stringify({v:1,s:vB64(VSALT),i:vB64(iv),d:vB64(enc)}));}
  catch(e){alert("저장 공간이 부족해 금고를 저장하지 못했어요.");}
}
function vTouch(){
  if(vTimer)clearTimeout(vTimer);
  vTimer=setTimeout(function(){ if(VKEY){vLock();vMsg="3분 동안 쓰지 않아 다시 잠갔어요.";vPaint();} },180000);
}
function vLock(){
  VKEY=null;VLIST=null;VSALT=null;vShow={};vEdit=null;vMsg="";
  if(vTimer){clearTimeout(vTimer);vTimer=null;}
}
function vJump(){closeEdit();setTimeout(openVault,110);}
function openVault(){
  vLock();
  document.getElementById("mTitle").textContent="🔒 개인 금고";
  document.getElementById("mIc").innerHTML="🔒";
  const f=document.getElementById("mForm");
  f.setAttribute("data-vault","1");
  f.innerHTML=vHtml();
  document.getElementById("mSave").style.display="none";
  document.getElementById("overlay").classList.add("on");
  vFocus();
}
function vPaint(){
  const f=document.getElementById("mForm");
  if(!f||f.getAttribute("data-vault")!=="1")return;
  f.innerHTML=vHtml();
  vFocus();
}
function vFocus(){
  const f=document.getElementById("mForm");if(!f)return;
  const a=f.querySelector("[data-focus]");if(a){try{a.focus();}catch(e){}}
}
function vFormHtml(it){
  const nw=!it;
  return `<div class="vrow" style="display:block">
    <input class="vin" id="vfs" placeholder="사이트 이름 (예: 국민은행)" value="${nw?"":esc(it.site||"")}" autocomplete="off" data-focus>
    <input class="vin" id="vfi" placeholder="아이디" value="${nw?"":esc(it.uid||"")}" autocomplete="off">
    <input class="vin" id="vfp" placeholder="비밀번호" value="${nw?"":esc(it.pw||"")}" autocomplete="off">
    <div style="display:flex;gap:7px">
      <button class="btn primary" onclick="vSave('${nw?"__new":it.id}')">저장</button>
      <button class="btn" onclick="vCancel()">취소</button>
    </div>
  </div>`;
}
function vHtml(){
  const msg=vMsg?`<div class="vwarn red">${esc(vMsg)}</div>`:"";
  if(!vCrypto())
    return `<div class="vwarn red">이 브라우저에서는 암호 잠금을 쓸 수 없어요.<br>주소가 <b>https</b> 로 시작하는지 확인해 주세요.</div>`;
  if(!VKEY){
    if(!vHas())
      return `<div class="vwrap">
        <div class="vwarn">사이트마다 쓰는 아이디와 비밀번호를 이 기기 안에만 잠가서 보관해요.<br>
        먼저 <b>숫자 4~6자리 PIN</b>을 정해 주세요. 이 PIN으로 내용을 암호로 잠그기 때문에
        <b>PIN을 잊으면 되살릴 방법이 없어요.</b></div>
        ${msg}
        <input class="vpin" id="vp1" type="password" inputmode="numeric" maxlength="6" placeholder="새 PIN" autocomplete="off" data-focus>
        <input class="vpin" id="vp2" type="password" inputmode="numeric" maxlength="6" placeholder="한 번 더" autocomplete="off"
          onkeydown="if(event.key==='Enter'){event.preventDefault();vSetup()}">
        <button class="btn primary" onclick="vSetup()">금고 만들기</button>
      </div>`;
    return `<div class="vwrap">
      <div class="vwarn">PIN을 넣으면 금고가 열려요. 창을 닫거나 3분 동안 쓰지 않으면 저절로 다시 잠겨요.</div>
      ${msg}
      <input class="vpin" id="vp1" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off" data-focus
        onkeydown="if(event.key==='Enter'){event.preventDefault();vUnlock()}">
      <button class="btn primary" onclick="vUnlock()">열기</button>
      <div class="vforget" onclick="vWipe()">PIN이 기억나지 않나요</div>
    </div>`;
  }
  const list=VLIST||[];
  const rows=list.map(it=>{
    if(vEdit===it.id)return vFormHtml(it);
    const sh=!!vShow[it.id];
    return `<div class="vrow">
      <div class="vmain">
        <div class="vsn">${esc(it.site||"이름 없음")}</div>
        <div class="vsi">${it.uid?esc(it.uid):"<span style=\"opacity:.5\">아이디 없음</span>"}</div>
        <div class="vpw">${sh?(esc(it.pw||"")||"—"):"••••••••"}</div>
      </div>
      <button class="vb ${sh?"on":""}" onclick="vToggle('${it.id}')">${sh?"숨기기":"보기"}</button>
      <button class="vb" onclick="vCopy('${it.id}','uid')">아이디 복사</button>
      <button class="vb" onclick="vCopy('${it.id}','pw')">비번 복사</button>
      <button class="vb" onclick="vPick('${it.id}')">수정</button>
      <button class="vb del" onclick="vDel('${it.id}')">✕</button>
    </div>`;
  }).join("");
  const add=(vEdit==="__new")?vFormHtml(null)
    :`<button class="btn primary" onclick="vPick('__new')">+ 새로 추가</button>`;
  return `<div class="vwrap">
    ${msg}
    <div>${rows||'<div class="vempty">아직 저장한 게 없어요.</div>'}</div>
    ${add}
    <div class="vwarn">이 내용은 <b>이 기기 브라우저에만</b> PIN으로 잠겨 저장돼요.
      백업 파일이나 구글 동기화에는 <b>들어가지 않아요.</b> 기기를 바꾸면 다시 넣어야 해요.</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn" onclick="vChangePin()">PIN 바꾸기</button>
      <button class="btn" onclick="vLock();vPaint()">지금 잠그기</button>
      <button class="btn danger" onclick="vWipe()">금고 비우기</button>
    </div>
  </div>`;
}
async function vSetup(){
  const a=((document.getElementById("vp1")||{}).value||"").trim();
  const b=((document.getElementById("vp2")||{}).value||"").trim();
  if(!/^[0-9]{4,6}$/.test(a)){vMsg="숫자 4~6자리로 정해 주세요.";vPaint();return;}
  if(a!==b){vMsg="두 번 넣은 PIN이 서로 달라요.";vPaint();return;}
  try{
    VSALT=crypto.getRandomValues(new Uint8Array(16));
    VKEY=await vDerive(a,VSALT);
    VLIST=[];vMsg="";vEdit="__new";
    await vPersist();vTouch();vPaint();
    try{toast("🔒 금고를 만들었어요");}catch(e){}
  }catch(e){vLock();vMsg="금고를 만들지 못했어요.";vPaint();}
}
async function vUnlock(){
  const p=((document.getElementById("vp1")||{}).value||"").trim();
  const raw=vRaw();if(!raw)return;
  let o;try{o=JSON.parse(raw);}catch(e){vMsg="저장된 금고가 손상됐어요.";vPaint();return;}
  try{
    const salt=vBuf(o.s),key=await vDerive(p,salt);
    const dec=await vCrypto().decrypt({name:"AES-GCM",iv:vBuf(o.i)},key,vBuf(o.d));
    VSALT=salt;VKEY=key;VLIST=JSON.parse(new TextDecoder().decode(dec));vShow={};vEdit=null;vMsg="";
    vTouch();vPaint();
  }catch(e){VKEY=null;VLIST=null;vMsg="PIN이 맞지 않아요.";vPaint();}
}
function vPick(id){if(!VKEY)return;vEdit=id;vMsg="";vTouch();vPaint();}
function vCancel(){vEdit=null;vMsg="";vTouch();vPaint();}
function vToggle(id){if(!VKEY)return;vShow[id]=!vShow[id];vTouch();vPaint();}
async function vSave(id){
  if(!VKEY)return;
  const g=x=>(((document.getElementById(x)||{}).value)||"").trim();
  const site=g("vfs"),uid=g("vfi"),pw=g("vfp");
  if(!site){vMsg="사이트 이름을 적어 주세요.";vPaint();return;}
  if(id==="__new")VLIST.push({id:vNewId(),site:site,uid:uid,pw:pw});
  else{const it=VLIST.find(x=>x.id===id);if(it){it.site=site;it.uid=uid;it.pw=pw;}}
  vEdit=null;vMsg="";
  await vPersist();vTouch();vPaint();
  try{toast("🔒 저장했어요");}catch(e){}
}
async function vDel(id){
  if(!VKEY)return;
  const it=VLIST.find(x=>x.id===id);if(!it)return;
  if(!confirm("'"+(it.site||"이 항목")+"' 을 금고에서 지울까요?\n되돌릴 수 없어요."))return;
  VLIST=VLIST.filter(x=>x.id!==id);delete vShow[id];if(vEdit===id)vEdit=null;
  await vPersist();vTouch();vPaint();
}
function vFallbackCopy(txt){
  try{
    const ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
    return true;
  }catch(e){return false;}
}
function vCopy(id,which){
  if(!VKEY)return;
  const it=VLIST.find(x=>x.id===id);if(!it)return;
  const txt=(which==="pw"?it.pw:it.uid)||"";
  if(!txt){try{toast("복사할 내용이 없어요");}catch(e){}return;}
  const done=()=>{try{toast("📋 "+(which==="pw"?"비밀번호":"아이디")+"를 복사했어요");}catch(e){}};
  vTouch();
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,function(){if(vFallbackCopy(txt))done();});
  else if(vFallbackCopy(txt))done();
}
async function vChangePin(){
  if(!VKEY)return;
  const a=prompt("새 PIN (숫자 4~6자리)");if(a===null)return;
  if(!/^[0-9]{4,6}$/.test(a.trim())){alert("숫자 4~6자리로 정해 주세요.");return;}
  const b=prompt("한 번 더 넣어 주세요");if(b===null)return;
  if(b.trim()!==a.trim()){alert("두 번 넣은 PIN이 서로 달라요.");return;}
  VSALT=crypto.getRandomValues(new Uint8Array(16));
  VKEY=await vDerive(a.trim(),VSALT);
  await vPersist();vTouch();
  alert("PIN을 바꿨어요 ✓");
}
function vWipe(){
  if(!vHas())return;
  if(!confirm("금고 안 내용이 전부 사라지고 PIN도 지워져요.\n되돌릴 수 없어요. 계속할까요?"))return;
  if(!confirm("정말 지울까요? 마지막 확인이에요."))return;
  try{localStorage.removeItem(VKEYNAME);}catch(e){}
  vLock();vPaint();
  try{toast("금고를 비웠어요");}catch(e){}
}

/* ===== 첫 실행 안내 마법사 ===== */
let ONB={mode:"full",step:0,name:"",tabs:null,sample:true};
const ONBSTEPS={
  full:["name","tabs","sample"],
  name:["name"],
  tabs:["tabs"]
};
function onbTabList(){ return Object.keys(SEED).filter(k=>!(SEED[k]&&SEED[k].secret)); }
function onbLabel(k){ return String((SEED[k]&&SEED[k].label)||k).replace(/^\S+\s/,""); }
function blankData(){
  const d=JSON.parse(JSON.stringify(SEED));
  Object.keys(d).forEach(k=>{
    const s=d[k];
    if(s.items)s.items=[];
    if(s.days)s.days={};
    if(s.entries)s.entries={};
    if(s.routines)s.routines=[];
    if(s.history)s.history=[];
    if("week" in s)s.week=null;
    if(s.followers)s.followers={cur:0,goal:1000};
    if(s.north){s.north.statement="";s.north.why="";s.north.q={1:"",2:"",3:"",4:""};s.north.goals=[];}
  });
  return d;
}
function onbStart(mode){
  ONB={
    mode:mode||"full",
    step:0,
    name:(DATA&&DATA.__ui&&DATA.__ui.owner)||CONFIG.owner||"",
    tabs:null,
    sample:CONFIG.sample!==false
  };
  const off=(DATA&&Array.isArray(DATA.__off))?DATA.__off:[];
  ONB.tabs=onbTabList().filter(k=>off.indexOf(k)<0);
  const el=document.getElementById("onb");
  if(!el)return;
  el.hidden=false;
  document.body.classList.add("onbon");
  onbRender();
}
function openName(){ onbStart("name"); }
function openTabs(){ onbStart("tabs"); }
function onbClose(){
  const el=document.getElementById("onb");
  if(el)el.hidden=true;
  document.body.classList.remove("onbon");
}
function onbSetName(v){ ONB.name=v; }
function onbToggle(k){
  const i=ONB.tabs.indexOf(k);
  if(i<0)ONB.tabs.push(k);
  else if(ONB.tabs.length>1)ONB.tabs.splice(i,1);
  else { try{toast("탭은 하나 이상 켜져 있어야 해요");}catch(e){} return; }
  onbRender();
}
function onbSample(v){ ONB.sample=!!v; onbRender(); }
function onbRender(){
  const steps=ONBSTEPS[ONB.mode]||ONBSTEPS.full;
  const cur=steps[ONB.step];
  const T=document.getElementById("onbT"),D=document.getElementById("onbD"),
        B=document.getElementById("onbB"),C=document.getElementById("onbCh"),
        dots=document.getElementById("onbDots"),
        back=document.getElementById("onbBack"),next=document.getElementById("onbNext");
  let ch="logo",t="",d="",body="";
  if(cur==="name"){
    ch="logo";
    t=ONB.mode==="name"?"이름 바꾸기":"만나서 반가워요";
    d="화면 곳곳에서 이렇게 불러 드릴게요. 나중에 설정에서 언제든 바꿀 수 있어요.";
    body='<input class="onbin" id="onbName" maxlength="20" placeholder="예: 지우" value="'+esc(ONB.name)+'" oninput="onbSetName(this.value)">'
       + '<p class="onbhint">비워두고 넘어가도 괜찮아요.</p>';
  }else if(cur==="tabs"){
    ch="project";
    t="어떤 걸 기록할까요?";
    d="필요한 것만 켜 두세요. 나중에 설정에서 다시 켜고 끌 수 있어요.";
    body='<div class="onbgrid">'+onbTabList().map(k=>
      '<button class="onbpick '+(ONB.tabs.indexOf(k)>=0?"on":"")+'" onclick="onbToggle(\''+k+'\')">'
      + chFace(k)+'<span>'+esc(onbLabel(k))+'</span><span class="tick">✓</span></button>').join("")
      +'</div>';
  }else{
    ch="daily";
    t="어떻게 시작할까요?";
    d="예시로 시작하면 앱이 어떻게 쓰이는지 바로 보여요. 언제든 전부 지울 수 있어요.";
    body='<button class="onbopt '+(ONB.sample?"on":"")+'" onclick="onbSample(true)">'
       + '<b>예시로 둘러보기</b><span>샘플 일정·할 일·기록이 채워진 상태로 시작해요.</span></button>'
       + '<button class="onbopt '+(ONB.sample?"":"on")+'" onclick="onbSample(false)">'
       + '<b>빈 상태로 시작</b><span>처음부터 내 내용만 채우고 싶을 때.</span></button>';
  }
  if(C)C.innerHTML='<img alt="" src="'+(CHAR[ch]||CHAR.logo)+'">';
  if(T)T.textContent=t;
  if(D)D.textContent=d;
  if(B)B.innerHTML=body;
  if(dots)dots.innerHTML=steps.length>1
    ? steps.map((s,i)=>'<i class="'+(i===ONB.step?"on":"")+'"></i>').join("") : "";
  if(back){
    back.textContent=ONB.step>0?"이전":(ONB.mode==="full"?"":"취소");
    back.style.visibility=(ONB.step>0||ONB.mode!=="full")?"visible":"hidden";
  }
  if(next)next.textContent=(ONB.step>=steps.length-1)
    ? (ONB.mode==="full"?"시작하기":"저장") : "다음";
  if(cur==="name"){ const i=document.getElementById("onbName"); if(i)setTimeout(()=>{try{i.focus();}catch(e){}},60); }
}
function onbGo(dir){
  const steps=ONBSTEPS[ONB.mode]||ONBSTEPS.full;
  if(dir<0){
    if(ONB.step>0){ ONB.step--; onbRender(); }
    else onbClose();
    return;
  }
  if(ONB.step<steps.length-1){ ONB.step++; onbRender(); return; }
  onbFinish();
}
function onbApplyTabs(){
  const off=onbTabList().filter(k=>ONB.tabs.indexOf(k)<0);
  DATA.__off=off;
}
function onbFinish(){
  if(ONB.mode==="full"){
    DATA=normalize(ONB.sample?JSON.parse(JSON.stringify(SEED)):blankData());
  }
  if(!DATA.__ui)DATA.__ui={};
  if(ONB.mode==="full"||ONB.mode==="name")DATA.__ui.owner=String(ONB.name||"").trim();
  if(ONB.mode==="full"||ONB.mode==="tabs")onbApplyTabs();
  DATA.__ui.setup=true;
  const ks=tabKeys();
  if(ks.indexOf(cur)<0)cur=ks[0]||"daily";
  save();
  onbClose();
  render();
  try{
    if(ONB.mode==="full")toast("반가워요"+(DATA.__ui.owner?", "+DATA.__ui.owner+" 님":"")+" 🎉");
    else toast("저장했어요");
  }catch(e){}
}
