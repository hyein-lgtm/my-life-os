/* 현재 탭의 한 줄 지표 → [퍼센트, 표시값, 단위, 라벨] */
function heroMetric(){
  try{
    const s=DATA[cur];
    if(s.type==="habit"){
      const st=monthStats(calY,calM),g=s.goalCount||20;
      return [Math.min(100,Math.round(st.cnt/g*100)),st.cnt,"/"+g,"이번 달"];
    }
    if(s.type==="daily"){
      const all=dayTodos(daySel),dn=all.filter(x=>x.done).length;
      if(!all.length) return [0,0,"개","오늘 할 일"];
      return [Math.round(dn/all.length*100),Math.round(dn/all.length*100),"%","오늘 해냄"];
    }
    if(s.type==="money"){
      const ym=ymNow(),sm=moSum(ym),bg=moBudget(ym);
      if(bg){const p=Math.min(100,Math.round(sm.out/bg*100));return [p,p,"%","예산 쓴 만큼"];}
      if(sm.inn>0){const p=Math.max(0,Math.min(100,Math.round(sm.left/sm.inn*100)));return [p,p,"%","남긴 비율"];}
      return [0,sm.cnt,"건","이번 달 기록"];
    }
    if(s.type==="muse"){
      const f=s.followers||{cur:0,goal:1};
      return [Math.min(100,Math.round(f.cur/(f.goal||1)*100)),
        Math.min(100,Math.round(f.cur/(f.goal||1)*100)),"%","팔로워 목표"];
    }
    if(s.type==="dream"){
      const t=s.items||[],dn=t.filter(x=>x.done).length;
      if(!t.length) return [0,0,"개","적어둔 꿈"];
      return [Math.round(dn/t.length*100),dn,"/"+t.length,"이뤄진 꿈"];
    }
    const its=s.items||[];
    if(!its.length) return [0,0,"개","적어둔 것"];
    const avg=Math.round(its.reduce((a,b)=>a+(+b.progress||0),0)/its.length);
    return [Math.min(100,avg),Math.min(100,avg),"%","평균 진행"];
  }catch(e){ return [0,0,"%","진행"]; }
}
function heroRing(){
  const m=heroMetric(),C=2*Math.PI*19.4;
  const off=C*(1-Math.max(0,Math.min(100,m[0]))/100);
  return '<svg class="hring" viewBox="0 0 44 44" aria-hidden="true">'
   +'<circle class="hrt" cx="22" cy="22" r="19.4"/>'
   +'<circle class="hrp" cx="22" cy="22" r="19.4" stroke-dasharray="'+C.toFixed(2)+'"'
   +' stroke-dashoffset="'+off.toFixed(2)+'"/></svg>'
   +'<div class="hrin"><b>'+m[1]+'<i>'+m[2]+'</i></b><span>'+m[3]+'</span></div>';
}
function cheerMsg(){
  const s=hs(),st=monthStats(calY,calM),goal=s.goalCount||20;
  const left=goal-st.cnt;
  if(st.cnt>=goal) return ["done","이번 달 목표 <b>달성 완료</b>! 대단해요 🎉 이 페이스 그대로 가요."];
  if(left<=3) return ["","목표까지 <b>"+left+"회</b> 남았어요. 거의 다 왔어요!"];
  const sd=streakDays();
  if(sd>=3) return ["","<b>"+sd+"일 연속</b> 운동 중! 오늘도 이어가 볼까요?"];
  if(st.cnt===0) return ["","이번 달 첫 기록을 남겨봐요. 15분 스트레칭도 충분해요."];
  return ["","이번 달 <b>"+st.cnt+"회</b> · "+hhmm(st.min)+" 기록했어요. 목표까지 "+left+"회!"];
}

    const a=museAgg(),f=s.followers;

    const idea=its.filter(i=>i.status==="아이디어"||i.status==="기획").length;

  }else{

    }else{

      cells=[["적어둔 것",its.length+"개"],["지금 붙잡은 것",doing+"개"],["끝낸 것",done+"개"],["절반 넘은 것",half+"개"],["체크한 항목",tdDone+" / "+tdAll]];

function cardDown(ev,id,now){
  if(CDRAG)return;
  if(!now){
    const t=ev.target;
    if(t&&t.closest&&t.closest("button,a,input,textarea,select,label"))return;
  }
  CDRAG={id:id,sx:ev.clientX,sy:ev.clientY,on:false,touch:ev.pointerType!=="mouse",t:null};
  if(now){cStart();}
  else{CDRAG.t=CDRAG.touch?setTimeout(cStart,300):null;}
  document.addEventListener("pointermove",cMove);
  document.addEventListener("pointerup",cUp);
  document.addEventListener("pointercancel",cUp);
  document.addEventListener("touchmove",cBlock,{passive:false});
}
function cStart(){
  if(!CDRAG)return;
  CDRAG.on=true;
  const g=document.querySelector(".grid,.pjlist");if(g)g.classList.add("reorder");
  const el=document.querySelector('.card[data-id="'+CDRAG.id+'"],.pj[data-id="'+CDRAG.id+'"]');if(el)el.classList.add("dragging");
  if(navigator.vibrate){try{navigator.vibrate(12);}catch(e){}}
}
function cBlock(ev){if(CDRAG&&CDRAG.on&&ev.cancelable)ev.preventDefault();}
function cardsPaint(){
  const g=document.querySelector(".grid,.pjlist");if(!g)return;
  const mk=g.classList.contains("pjlist")?pjRow:(DATA[cur].type==="muse"?museCard:taskCard);
  g.innerHTML=visible().map(mk).join("");
  g.classList.add("reorder");
  if(CDRAG){const nw=g.querySelector('[data-id="'+CDRAG.id+'"]');if(nw)nw.classList.add("dragging");}
}
function cMove(ev){
  if(!CDRAG)return;
  if(!CDRAG.on){
    const d=Math.abs(ev.clientX-CDRAG.sx)+Math.abs(ev.clientY-CDRAG.sy);
    if(CDRAG.touch){if(d>10){clearTimeout(CDRAG.t);cEnd();}return;}
    if(d>6){cStart();}else{return;}
  }
  if(!document.elementFromPoint)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const c=el&&el.closest?el.closest(".card,.pj"):null;
  if(!c||!c.dataset.id||c.dataset.id===CDRAG.id)return;
  const a=cardsArr();
  let i=-1,j=-1;
  a.forEach((x,n)=>{if(x.id===CDRAG.id)i=n;if(x.id===c.dataset.id)j=n;});
  if(i<0||j<0)return;
  a.splice(j,0,a.splice(i,1)[0]);
  save();cardsPaint();
}
function cUp(){
  if(CDRAG&&CDRAG.on){noClick=true;setTimeout(function(){noClick=false;},350);}
  const moved=!!(CDRAG&&CDRAG.on);
  cEnd();
  if(moved)render();
}
function cEnd(){
  if(CDRAG&&CDRAG.t)clearTimeout(CDRAG.t);
  CDRAG=null;
  document.removeEventListener("pointermove",cMove);
  document.removeEventListener("pointerup",cUp);
  document.removeEventListener("pointercancel",cUp);
  document.removeEventListener("touchmove",cBlock);
  const g=document.querySelector(".grid,.pjlist");if(g)g.classList.remove("reorder");
  const d=document.querySelector(".card.dragging,.pj.dragging");if(d)d.classList.remove("dragging");
}

function mo(){return tabKeys().map(k=>DATA[k]).find(x=>x.type==="money")||DATA.money;}
function moCats(kind){const s=mo();return (((s&&s.cats)||[])).filter(c=>!kind||c.kind===kind);}
function moCat(id){const s=mo();return (((s&&s.cats)||[])).find(c=>c.id===id)||{id:id,name:"기타",kind:"out",color:"#94a3b8"};}
function won(n){return Math.round(+n||0).toLocaleString("ko-KR");}
function moKindOf(e){return (e&&(e.kind==="in"||e.kind==="save"))?e.kind:"out";}
function ymNow(){return calY+"-"+String(calM+1).padStart(2,"0");}
function moDays(ym){
  const s=mo();if(!s)return [];
  return Object.keys(s.entries||{}).filter(k=>k.slice(0,7)===ym&&(s.entries[k]||[]).length).sort().reverse();
}
function moSum(ym){
  const s=mo(),r={inn:0,out:0,sav:0,per:{},cnt:0,left:0};
  if(!s)return r;
  Object.keys(s.entries||{}).forEach(k=>{
    if(k.slice(0,7)!==ym)return;
    (s.entries[k]||[]).forEach(e=>{
      const kd=moKindOf(e),a=Math.max(0,+e.amt||0);
      r.cnt++;
      if(kd==="in")r.inn+=a; else if(kd==="save")r.sav+=a; else {r.out+=a;r.per[e.cat]=(r.per[e.cat]||0)+a;}
    });
  });
  r.left=r.inn-r.out-r.sav;
  return r;
}
function moBudget(ym){const s=mo();return Math.max(0,+(((s&&s.budget)||{})[ym])||0);}
function moLeftDays(ym){
  const t=todayStr(),y=+ym.slice(0,4),m=+ym.slice(5,7)-1,tot=monthDays(y,m);
  if(ym===t.slice(0,7))return Math.max(1,tot-(+t.slice(8,10))+1);
  return tot;
}
function moFilterOk(e){return filter==="ALL"||moKindOf(e)===filter;}

function moFmt(el){const raw=String(el.value||"").replace(/[^0-9]/g,"").slice(0,12);el.value=raw?(+raw).toLocaleString("ko-KR"):"";}

function saveMoney(){
  const s=mo();if(!s)return;
  const amt=moAmt();
  if(!amt){alert("금액을 입력해주세요.");const a=document.getElementById("mo_amt");if(a)a.focus();return;}
  const dEl=document.getElementById("mo_date");
  let day=(dEl&&dEl.value)||moDayCur||todayStr();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day))day=todayStr();
  const mEl=document.getElementById("mo_memo");
  const memo=((mEl&&mEl.value)||"").trim();
  const cat=moPickId||((moCats(moKindCur)[0]||{}).id)||"";
  const wasEdit=moEditId,kd=moKindCur;
  s.entries=s.entries||{};
  if(wasEdit) Object.keys(s.entries).forEach(k=>{
    s.entries[k]=(s.entries[k]||[]).filter(x=>x.id!==wasEdit);
    if(!s.entries[k].length)delete s.entries[k];});
  s.entries[day]=s.entries[day]||[];
  s.entries[day].push({id:wasEdit||uid(),kind:kd,cat:cat,amt:amt,memo:memo});
  const y=+day.slice(0,4),m=+day.slice(5,7)-1;
  if(y!==calY||m!==calM){calY=y;calM=m;}
  if(filter!=="ALL"&&filter!==kd)filter="ALL";
  closeEdit();render();
  toast(wasEdit?"✎ 고쳤어요":(kd==="in"?"＋ 들어온 돈 ":kd==="save"?"＋ 모은 돈 ":"＋ 나간 돈 ")+won(amt)+"원 적었어요");
}
function delMoney(){
  const s=mo();if(!s||!moEditId)return;
  const id=moEditId;let day="",idx=-1,gone=null;
  Object.keys(s.entries||{}).forEach(k=>{
    const i=(s.entries[k]||[]).findIndex(x=>x.id===id);
    if(i>=0){day=k;idx=i;gone=s.entries[k][i];}});
  if(!gone)return;
  s.entries[day].splice(idx,1);
  if(!s.entries[day].length)delete s.entries[day];
  closeEdit();render();
  toastU("🗑 기록을 지웠어요",function(){
    const t=mo();if(!t)return;
    t.entries[day]=t.entries[day]||[];
    t.entries[day].splice(Math.min(idx,t.entries[day].length),0,gone);
    render();toast("↩ 되돌렸어요");
  });
}

const WX=["캠핑","혼밥","산책","커피","독서","드라이브","정리","달리기"];
const WP=["근교","동네","바다 앞","숲속","카페","집"];
function wkOf(k){const d=new Date(k+"T00:00:00");return Math.floor(d.getTime()/604800000);}
function genWeek(){
  const s=ms(),ws=weekStart(todayStr()),n=wkOf(ws);
  const ep=((s.items||[]).filter(i=>/EP\./.test(i.title)).length)+1;
  const slots=WPAT.map((p,i)=>{
    const pick=a=>a[(n+i)%a.length];
    const t=pick(p.t).replace("{n}",String(ep+i>9?ep:"0"+(ep))).replace("{x}",WX[(n+i)%WX.length]).replace("{p}",WP[(n+i*2)%WP.length]);
    return {id:uid(),d:addDays(ws,p.d),tag:p.tag,title:t,hook:pick(p.h),note:"",made:false};
  });
  s.week={start:ws,src:"auto",made:todayStr(),slots:slots};
  save();render();
}
function slotCard(id){
  const s=ms(),sl=(s.week&&s.week.slots||[]).find(x=>x.id===id); if(!sl)return;
  const o={id:uid(),title:sl.title,tag:sl.tag||(s.tags||[])[0]||"릴스",status:"기획",progress:0,
    start:todayStr(),due:sl.d,owner:"",hook:sl.hook||"",concept:sl.note||"",cta:"",hashtags:"",
    url:"",stats:{views:0,likes:0,comments:0,saves:0,shares:0,follows:0},
    todos:[{id:uid(),text:"촬영",done:false},{id:uid(),text:"편집",done:false},{id:uid(),text:"업로드",done:false}],
    milestones:[],links:[],logs:[],quotes:[],desc:"",goal:"",note:""};
  s.items.unshift(o);sl.made=true;save();render();openDetail(o.id);
}
function delSlot(id){

function weekBox(){
  const s=ms(),ws=weekStart(todayStr()),w=s.week;
  const fresh=w&&w.start===ws;
  const body=(fresh&&(w.slots||[]).length)?w.slots.map(sl=>`<div class="wslot ${sl.made?"done":""}">
      <div class="wsd">${korDate(sl.d).replace(/^\d+년 /,"")}<span>${esc(sl.tag||"")}</span></div>

    :`<div class="nempty">이번 주 스케줄이 아직 없어요. 매주 월요일 오전 9시에 클로드가 만들어 두거나, 아래 버튼으로 바로 뽑을 수 있어요.</div>`;
  const src=fresh?(w.src==="claude"?"🤖 클로드 자동 생성":"⚙ 자동 생성"):"";
  return `<div class="weekbox">
    <div class="wbh">🗓 이번 주 콘텐츠 스케줄 <span class="wbd">${ws.slice(5)} ~ ${addDays(ws,6).slice(5)}</span>

}

function toast(msg){return toastU(msg,null);}
function toastU(msg,undoFn){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}
  el.innerHTML="";
  const sp=document.createElement("span");sp.className="tmsg";sp.textContent=msg;el.appendChild(sp);
  if(undoFn){
    const b=document.createElement("button");
    b.type="button";b.className="tundo";b.textContent="↩ 되돌리기";
    b.setAttribute("aria-label","방금 삭제한 항목 되돌리기");
    b.onclick=function(){el.className="";clearTimeout(toast._t);try{undoFn();}catch(e){}};
    el.appendChild(b);
  }
  el.className=undoFn?"on hasu":"on";
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){el.className="";},undoFn?7000:1800);
}

function dSetMain(x){
  if(x<=0)return;
  const a=dreamPick;a.unshift(a.splice(x,1)[0]);dPaint();
}
function dDel(x){dreamPick.splice(x,1);dPaint();}
function dreamClear(){dreamPick=[];dPaint();}
function dreamFile(el){
  const fs=[...(el.files||[])];
  if(!fs.length)return;
  const room=DMAX-dreamPick.length;
  if(room<=0){alert("사진은 최대 "+DMAX+"장까지예요.");el.value="";return;}
  const use=fs.slice(0,room);
  if(fs.length>room)alert("최대 "+DMAX+"장이라 "+room+"장만 넣었어요.");
  let left=use.length;
  use.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const M=860,sc=Math.min(1,M/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let out="";
        try{out=c.toDataURL("image/webp",0.7);}catch(err){out="";}
        if(!out||out.indexOf("image/webp")<0)out=c.toDataURL("image/jpeg",0.74);
        dreamPick.push(out);
        if(!--left){dPaint();}
      };
      img.onerror=()=>{if(!--left)dPaint();};
      img.src=e.target.result;
    };
    r.onerror=()=>{if(!--left)dPaint();};
    r.readAsDataURL(f);
  });
  el.value="";
}

const STEPS=[{v:0,n:"시작 전"},{v:25,n:"조금 했어"},{v:50,n:"절반쯤"},{v:80,n:"거의 다"},{v:100,n:"완료"}];
function stepIdx(p){
  const x=Math.max(0,Math.min(100,+p||0));
  let b=0,bd=999;
  STEPS.forEach((s,k)=>{const d=Math.abs(s.v-x);if(d<bd){bd=d;b=k;}});
  return b;
}
function stepName(p){return STEPS[stepIdx(p)].n;}
function stepView(p){
  const k=stepIdx(p);
  return `<div class="stepv k${k}">
    <span class="sdots">${STEPS.map((s,x)=>`<i class="${x<=k?"on":""}"></i>`).join("")}</span>
    <b>${STEPS[k].n}</b></div>`;
}
function stepPick(k,fn){
  return `<div class="steppick">${STEPS.map((s,x)=>
    `<button type="button" class="sbtn ${x===k?"on":""} k${x}" onclick="${fn}(${x})">${s.n}</button>`).join("")}</div>`;
}
function applyStep(i,x){
  const v=STEPS[Math.max(0,Math.min(4,+x||0))].v;

  else{if(i.status==="완료")i.status="진행중";else if(v>0&&i.status==="할일")i.status="진행중";}
}

/* --- 2026 북극성 (연간 목표) --- */
const NSAREA={
  manual:{n:"직접 입력",t:null},
  project:{n:"프로젝트",t:"project"},
  work:{n:"업무",t:"work"},
  daily:{n:"데일리 투두",t:"daily"},
  book:{n:"독서",t:"book"},
  habit:{n:"운동",t:"habit"},
  muse:{n:"브랜드",t:"muse"},
  money:{n:"재테크 관리",t:"money"}
};
const NSAUTO={
  none:"자동 집계 안 함",
  card_done:"완료한 카드 수",
  book_done:"완독한 책 수",
  habit_cnt:"올해 운동 횟수",
  habit_min:"올해 운동 시간(분)",
  muse_pub:"발행한 콘텐츠 수",
  muse_fol:"현재 팔로워 수",
  money_save:"올해 모은 돈 (원)",
  money_in:"올해 들어온 돈 (원)",
  money_out:"올해 나간 돈 (원)",
  daily_done:"완료한 할 일 수"
};
function ns(){
  const p=DATA.project||{};
  if(!p.north)p.north={year:2026,statement:"",why:"",goals:[],q:{}};
  const n=p.north;
  n.year=+n.year||2026;
  n.statement=n.statement||"";n.why=n.why||"";
  n.goals=Array.isArray(n.goals)?n.goals:[];
  n.q=n.q||{};
  n.goals.forEach(g=>{
    g.id=g.id||uid();g.area=NSAREA[g.area]?g.area:"manual";
    g.auto=NSAUTO[g.auto]?g.auto:"none";
    g.target=+g.target||0;g.cur=+g.cur||0;g.unit=g.unit||"";
    g.q=(g.q>=1&&g.q<=4)?+g.q:4;
  });
  return n;
}
function nsYear(){return ns().year;}
function nsIn(dt){const y=String(nsYear());return dt&&String(dt).slice(0,4)===y;}
function nsAutoVal(g){
  const y=String(nsYear());
  try{
    if(g.auto==="card_done"){
      const s=DATA[g.area];if(!s||!Array.isArray(s.items))return 0;
      return s.items.filter(i=>i.status==="완료"||i.status==="발행").length;
    }
    if(g.auto==="book_done"){
      const s=DATA.book;return (s.items||[]).filter(i=>i.status==="완료").length;
    }
    if(g.auto==="habit_cnt"){
      const e=(hs().entries)||{};let n=0;
      Object.keys(e).forEach(k=>{if(k.slice(0,4)===y)n+=(e[k]||[]).length;});return n;
    }
    if(g.auto==="habit_min"){
      const e=(hs().entries)||{};let n=0;
      Object.keys(e).forEach(k=>{if(k.slice(0,4)===y)(e[k]||[]).forEach(x=>n+=(+x.min||0));});return n;
    }
    if(g.auto==="muse_pub"){return (ms().items||[]).filter(i=>i.status==="발행").length;}
    if(g.auto==="muse_fol"){return +((ms().followers||{}).cur)||0;}
    if(g.auto==="money_save"||g.auto==="money_in"||g.auto==="money_out"){
      const s=mo(); if(!s) return 0;
      const kd=g.auto==="money_save"?"save":g.auto==="money_in"?"in":"out";
      let n=0;
      Object.keys(s.entries||{}).forEach(k=>{
        if(k.slice(0,4)!==y)return;
        (s.entries[k]||[]).forEach(e=>{ if((e.kind||"out")===kd) n+=(+e.amt||0); });
      });
      return n;
    }
    if(g.auto==="daily_done"){
      const d=(ds().days)||{};let n=0;
      Object.keys(d).forEach(k=>{if(k.slice(0,4)===y)n+=(d[k]||[]).filter(t=>t.done).length;});return n;
    }
  }catch(e){}
  return 0;
}
function nsVal(g){return g.auto&&g.auto!=="none"?nsAutoVal(g):(+g.cur||0);}
function nsPct(g){const t=+g.target||0;if(!t)return 0;return Math.max(0,Math.min(100,Math.round(nsVal(g)/t*100)));}
function nsKind(g){return g.kind==="sub"?"sub":"core";}
function nsCore(){return ns().goals.filter(g=>nsKind(g)==="core");}
function nsSub(){return ns().goals.filter(g=>nsKind(g)==="sub");}
function nsAll(){
  const g=ns().goals;if(!g.length)return 0;
  let w=0,t=0;
  g.forEach(x=>{const k=nsKind(x)==="core"?2:1;w+=k;t+=nsPct(x)*k;});
  return w?Math.round(t/w):0;
}
function nsCoreAll(){const g=nsCore();if(!g.length)return 0;return Math.round(g.reduce((a,x)=>a+nsPct(x),0)/g.length);}
function nsDays(){
  const y=nsYear(),end=new Date(y,11,31),now=new Date();
  return Math.max(0,Math.ceil((end-now)/86400000));
}
function nsElapsed(){
  const y=nsYear(),a=new Date(y,0,1),b=new Date(y+1,0,1),now=new Date();
  return Math.max(0,Math.min(100,Math.round((now-a)/(b-a)*100)));
}
function nsQnow(){const m=new Date().getMonth();return Math.floor(m/3)+1;}
function nsQopts(cq){
  const l=nsQlist().slice();
  if(cq&&l.indexOf(cq)<0)l.unshift(cq);
  return l.map(q=>`<option value="${q}" ${cq===q?"selected":""}>Q${q}까지 (${(q-1)*3+1}~${q*3}월)</option>`).join("");
}
function nsQlist(){const c=nsQnow();const a=[];for(let q=c;q<=4;q++)a.push(q);return a.length?a:[4];}
const NSEMO={manual:"✍",project:"🗂",work:"💼",daily:"✅",book:"📚",habit:"🏃",muse:"✨",money:"💰"};
function nsBar(g,kind){
  const p=nsPct(g),v=nsVal(g),t=+g.target||0,a=NSAREA[g.area]||NSAREA.manual;
  const auto=g.auto&&g.auto!=="none",el=nsElapsed();
  const cls=p>=100?"full":(p<Math.max(0,el-12)?"late":"");
  const kc=(kind||nsKind(g))==="sub"?"issub":"iscore";
  const left=Math.max(0,t-v);
  return `<div class="nsg ${cls} ${kc}" onclick="openGoal('${g.id}')">
    <div class="nsgt"><b>${esc(g.title||"제목 없음")}</b>
      ${p>=100?`<span class="nsdone">🎉 완주</span>`:""}
      ${auto?`<span class="nsauto" title="다른 탭에서 자동 집계">⚡ 자동</span>`:""}
      <span class="nsq">Q${g.q}</span></div>
    <div class="nsgm"><span class="nsnum">${nfm(v)}<em> / ${nfm(t)}${esc(g.unit||"")}</em></span>
      <span class="nspct ${cls}">${p}<i>%</i></span></div>
    <div class="nsbar"><i style="width:${p}%" class="${cls}"></i><u style="left:${el}%"></u>
      <b class="nsrun" style="left:${Math.min(100,p)}%">${p>=100?"🏆":"🏃"}</b></div>
    <div class="nsgf"><span class="nsarea">${NSEMO[g.area]||"✍"} ${esc(a.n)}</span>
      ${p>=100?`<span class="nsleft ok">다 채웠어요</span>`:`<span class="nsleft">${nfm(left)}${esc(g.unit||"")} 더 가면 도착</span>`}
      ${g.note?`<span class="nsnote">${esc(g.note)}</span>`:""}</div>
  </div>`;
}
function nsCheer(all,el){
  const g=all-el;
  if(all>=100) return {e:"🏆",t:"올해 목표 <b>완주</b>! 진짜 해냈어요.",s:"남은 기간은 보너스 트랙이에요."};
  if(all<=0)   return {e:"🥾",t:"아직 <b>출발선</b>이에요.",s:"작은 목표 하나부터 채우면 바퀴가 굴러가요."};
  if(g>=12)    return {e:"🚀",t:"계획보다 <b>"+g+"%p 앞서</b> 달리는 중!",s:"이 페이스면 여유 있게 도착해요."};
  if(g>=0)     return {e:"🔥",t:"딱 <b>페이스대로</b> 가고 있어요.",s:"지금처럼만 하면 돼요."};
  if(g>=-12)   return {e:"👟",t:"살짝 <b>"+(-g)+"%p 뒤</b>에 있어요.",s:"이번 주에 한 칸만 당기면 따라잡아요."};
  return {e:"🧭",t:"<b>"+(-g)+"%p 뒤처졌어요.</b>",s:"핵심 목표 하나만 골라서 거기부터 밀어봐요."};
}

function ui(){ if(!DATA.__ui)DATA.__ui={}; return DATA.__ui; }
function weekKeyNow(){ return weekStart(todayStr()); }
function oneLine(){ const u=ui(); return (u.one&&u.one.d===todayStr())?(u.one.t||""):""; }
function focusLine(){ const u=ui(); return (u.wk&&u.wk.k===weekKeyNow())?(u.wk.t||""):""; }
function renderToday(){
  const el=document.getElementById("todayline"); if(!el)return;
  const o=oneLine(), f=focusLine();
  el.innerHTML=
    '<button type="button" class="tl one" onclick="editOne()" aria-label="오늘의 한 문장 쓰기">'+
      '<i class="tld"></i><span class="tlk">오늘의 한 문장</span>'+
      '<span class="tlv '+(o?"":"ph")+'">'+(o?esc(o):"오늘 나에게 해주고 싶은 말은?")+'</span><span class="tle">✎</span></button>'+
    '<button type="button" class="tl wk" onclick="editFocus()" aria-label="이번 주의 중심 쓰기">'+
      '<i class="tld"></i><span class="tlk">이번 주의 중심</span>'+
      '<span class="tlv '+(f?"":"ph")+'">'+(f?esc(f):"이번 주에 제일 중요한 하나")+'</span><span class="tle">✎</span></button>';
}
function editOne(){ tlEdit("one"); }
function editFocus(){ tlEdit("wk"); }
function tlEdit(kind){
  const el=document.getElementById("todayline"); if(!el)return;
  const btn=el.querySelector(kind==="one"?".tl.one":".tl.wk"); if(!btn||btn.querySelector("input"))return;
  const old=kind==="one"?oneLine():focusLine();
  const sp=btn.querySelector(".tlv"); if(!sp)return;
  const inp=document.createElement("input");
  inp.type="text"; inp.className="tlin"; inp.value=old; inp.maxLength=60;
  inp.setAttribute("autocomplete","off");
  inp.setAttribute("aria-label",kind==="one"?"오늘의 한 문장":"이번 주의 중심");
  sp.textContent=""; sp.className="tlv"; sp.appendChild(inp);
  inp.focus(); try{inp.setSelectionRange(old.length,old.length);}catch(e){}
  let closed=false;
  const commit=function(ok){
    if(closed)return; closed=true;
    const v=(inp.value||"").trim();
    if(ok&&v!==old){
      const u=ui();
      if(kind==="one")u.one={d:todayStr(),t:v}; else u.wk={k:weekKeyNow(),t:v};
      save(); try{toast(v?"✎ 적어뒀어요":"지웠어요");}catch(e){}
    }
    renderToday();
  };
  inp.onkeydown=function(e){
    if(e.key==="Enter"){e.preventDefault();commit(1);}
    else if(e.key==="Escape"){e.preventDefault();commit(0);}
  };
  inp.onblur=function(){commit(1);};
}

function statSay(){
  const s=DATA[cur];
  try{
    if(s.type==="habit"){
      const st=monthStats(calY,calM);
      return st.cnt?("몸을 챙긴 날이 <b>"+st.days+"일</b>. 생각보다 많이 해냈어요."):"이번 달 첫 기록을 남겨볼까요? 15분도 충분해요.";
    }
    if(s.type==="dream"){
      const t=s.items||[];
      return t.length?("적어둔 꿈 <b>"+t.length+"개</b>. 말로 꺼낸 것만으로도 반은 온 거예요."):"여기엔 아무한테도 못 한 이야기를 적어요.";
    }
    if(s.type==="muse"){
      const a=museAgg();
      return a.upM?("이번 달 <b>"+a.upM+"개</b>를 세상에 내보냈어요."):"기획만 있어도 괜찮아요. 시작은 늘 거기서예요.";
    }
    const its=s.items||[];
    if(!its.length) return "아직 비어 있어요. 한 줄부터 가볍게 적어봐요.";
    const done=its.filter(function(i){return i.status==="완료";}).length;
    if(done) return "여기서만 <b>"+done+"개</b>를 끝냈어요. 잘 쌓이고 있어요.";
    return "시작해둔 게 <b>"+its.length+"개</b>. 오늘은 하나만 밀어볼까요?";
  }catch(e){return "";}
}

  </div>
  <div class="notepv" id="pv_${id}">${t.indexOf("==")>=0?hlHtml(t):'<span class="pvph">칠한 부분이 여기에 노랗게 보여요</span>'}</div>`;

function hlHtml(t){return esc(t||"").replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>');}
function applyNote(el){
  if(!el)return;
  if(el.id!=="f_note"){const i=find(detailId);if(i){i.note=el.value;save();}}
  const pv=document.getElementById("pv_"+el.id);
  if(pv){const h=hlHtml(el.value);
    pv.innerHTML=h?h:'<span class="pvph">칠한 부분이 여기에 노랗게 보여요</span>';}
  const c=document.getElementById("noteCnt");if(c)c.textContent=(el.value||"").length+"자";
}
function noteHl(id){
  const el=document.getElementById(id);if(!el)return;
  const v=el.value,a=el.selectionStart,b=el.selectionEnd;
  if(a===b){try{toast("칠할 부분을 먼저 드래그해서 골라주세요");}catch(e){}el.focus();return;}
  let sel=v.slice(a,b);
  /* 앞뒤 공백은 칠하지 않기 */
  const lead=sel.length-sel.replace(/^\s+/,"").length;
  sel=sel.replace(/^\s+/,"");
  const tail=sel.length-sel.replace(/\s+$/,"").length;
  sel=sel.replace(/\s+$/,"");
  if(!sel){try{toast("칠할 부분을 먼저 드래그해서 골라주세요");}catch(e){}el.focus();return;}
  const A=a+lead,B=b-tail;
  let out,na,nb;
  if(/^==[\s\S]+==$/.test(sel)){out=sel.slice(2,-2);na=A;nb=A+out.length;}
  else if(v.slice(Math.max(0,A-2),A)==="=="&&v.slice(B,B+2)==="=="){
    el.value=v.slice(0,A-2)+sel+v.slice(B+2);
    el.setSelectionRange(A-2,B-2);applyNote(el);el.focus();return;
  }
  else{out="=="+sel+"==";na=A;nb=A+out.length;}
  el.value=v.slice(0,A)+out+v.slice(B);
  el.setSelectionRange(na,nb);
  applyNote(el);el.focus();
}

/* 「완독」 같은 완료용 분류가 있는 탭(독서)에서는, 체크리스트를 다 채우면
   분류도 저절로 완독이 됩니다. 체크를 풀면 원래 분류로 되돌아갑니다.
   그 밖의 탭은 분류(신규·외주 등)를 건드리지 않고 완료 표시만 붙습니다. */
function DONETAG(){ return "완독"; }
function autoTag(i,key){
  const s=DATA[key||cur];
  if(!s||!Array.isArray(s.tags)||s.tags.indexOf(DONETAG())<0) return "";
  const was=i.tag;
  if((+i.progress||0)>=100){ if(i.tag!==DONETAG()) i._pretag=i.tag||""; i.tag=DONETAG(); }
  else if(i.tag===DONETAG()){
    const back=i._pretag||"";
    i.tag=(back&&s.tags.indexOf(back)>=0)?back:((s.tags.indexOf("읽는중")>=0)?"읽는중":(s.tags[0]||i.tag));
    delete i._pretag;
  }
  return (was===i.tag)?"":i.tag;
}
function autoProgress(i,key){
  if(!i.todos.length)return "";
  i.progress=Math.round(i.todos.filter(t=>t.done).length/i.todos.length*100);
  if(i.progress===100) i.status="완료";
  else if(i.status==="완료") i.status=(i.progress>0)?"진행중":"할일";   /* 체크를 풀면 완료도 풀립니다 */
  else if(i.progress>0&&i.status==="할일") i.status="진행중";
  return autoTag(i,key);
}
/* 분류가 저절로 바뀌면 알려주고, 그 카드가 필터에 가려지지 않게 필터를 풀어줍니다 */
function autoTagSay(ch){
  if(!ch)return;
  if(filter!=="ALL"&&filter!==ch) filter="ALL";
  try{ toast(ch===DONETAG()?"📚 다 읽었네요! 「완독」으로 바꿨어요":"↩ 「"+ch+"」으로 되돌렸어요"); }catch(e){}
}

const SUBNAME={todos:"체크리스트 항목",milestones:"마일스톤",links:"링크",quotes:"문장",logs:"기록"};
/* 상세 화면 안의 모든 줄을 그 자리에서 고칠 수 있게 */
function editRow(btn,key,x,prop){
  const i=find(detailId);if(!i||!i[key]||!i[key][x])return;
  const row=btn.closest(".row,.qrow,.frow");if(!row)return;
  const sp=row.querySelector(".grow,.qtext");if(!sp||sp.querySelector("input"))return;
  const old=String(i[key][x][prop]==null?"":i[key][x][prop]);
  const inp=document.createElement("input");
  inp.type="text";inp.className="rowin";inp.value=old;
  inp.setAttribute("autocomplete","off");inp.setAttribute("aria-label","내용 수정");
  sp.textContent="";sp.appendChild(inp);
  inp.focus();try{inp.setSelectionRange(old.length,old.length);}catch(e){}
  let closed=false;
  const commit=ok=>{
    if(closed)return;closed=true;
    const v=(inp.value||"").trim();
    if(ok&&v&&v!==old){i[key][x][prop]=v;save();try{toast("✎ 고쳤어요");}catch(e){}}
    renderDetail();
  };
  inp.onkeydown=e=>{
    if(e.key==="Enter"){e.preventDefault();commit(1);}
    else if(e.key==="Escape"){e.preventDefault();commit(0);}
  };
  inp.onblur=()=>commit(1);
}
function delSub(key,tid){

  const x=i[key].findIndex(v=>v.id===tid);if(x<0)return;
  const gone=i[key][x],id=detailId;

  toastU("🗑 "+(SUBNAME[key]||"항목")+"을 지웠어요"+(ch0?" · 분류는 「"+ch0+"」로 바뀌었어요":""),function(){
    const j=find(id)||i;j[key].splice(Math.min(x,j[key].length),0,gone);
    if(key==="todos")autoProgress(j);save();renderDetail();render();toast("↩ 되돌렸어요");
  });
}

const FMAXMB=2;
function fSize(n){n=+n||0;return n<1024?n+"B":(n<1048576?Math.round(n/1024)+"KB":(n/1048576).toFixed(1)+"MB");}
function lkHtml(l){
  if(l&&l.file&&l.file.d)
    return `<a class="fdl" href="${esc(l.file.d)}" download="${esc(l.file.n||"파일")}">📎 ${esc(l.label||l.file.n||"파일")}</a><span class="fsz">${fSize(l.file.s)}</span>`;
  return l&&l.url?`<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label||l.url)}</a>`:esc((l&&l.label)||"");
}
function addFileLink(el){
  const fs=[...(el.files||[])];el.value="";
  if(!fs.length)return;
  const i=find(detailId);if(!i)return;
  i.links=i.links||[];
  const lim=FMAXMB*1024*1024,skipped=[];
  let left=fs.length;
  const put=(f,d)=>{i.links.push({label:f.name,url:"",file:{n:f.name,t:f.type||"",s:Math.round(d.length*0.75),d:d}});};
  const done=()=>{
    save();renderDetail();
    if(skipped.length)alert("너무 커서 담지 못한 파일이 있어요 (한 개당 "+FMAXMB+"MB까지)\n\n"+skipped.join("\n"));
    else{try{toast("📎 파일을 담았어요");}catch(e){}}
  };
  fs.forEach(f=>{
    if(f.size>lim){skipped.push(f.name);if(!--left)done();return;}
    const r=new FileReader();
    r.onload=e=>{
      const d=e.target.result;
      if(/^image\//.test(f.type||"")){
        const img=new Image();
        img.onload=()=>{
          const M=1400,sc=Math.min(1,M/Math.max(img.width,img.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          let out="";try{out=c.toDataURL("image/webp",0.75);}catch(err){out="";}
          if(!out||out.indexOf("image/webp")<0){try{out=c.toDataURL("image/jpeg",0.8);}catch(err2){out="";}}
          put(f,out||d);if(!--left)done();
        };
        img.onerror=()=>{put(f,d);if(!--left)done();};
        img.src=d;
      }else{put(f,d);if(!--left)done();}
    };
    r.onerror=()=>{skipped.push(f.name);if(!--left)done();};
    r.readAsDataURL(f);
  });
}

/* ---- 홈화면 앱 설치(PWA) ---- */
const APPICON="data:image/png;base64,"+ICON;
(function(){
  const set=(sel,attr,val)=>{const e=document.querySelector(sel);if(e)e.setAttribute(attr,val);};
  set('link[rel="icon"]',"href",APPICON);          /* 탭 아이콘은 항상 내장본 */
  const web=(location.protocol==="http:"||location.protocol==="https:");
  if(web){
    /* 인터넷 주소로 열었을 때 — 옆에 있는 manifest.webmanifest 와 sw.js 를 그대로 씁니다.
       이 두 가지가 있어야 안드로이드 Chrome이 「앱 설치」를 띄워줍니다.
       서비스워커는 사용자가 쓴 기록(localStorage)에 접근하지 않으므로 기록은 안전합니다. */
    if("serviceWorker" in navigator){
      window.addEventListener("load",function(){
        try{ navigator.serviceWorker.register("sw.js",{scope:"./"}); }catch(e){}
      });
    }
  }else{
    /* index.html 파일을 그냥 더블클릭해서 연 경우 — 옆 파일을 못 읽으므로 내장본으로 대체 */
    set('link[rel="apple-touch-icon"]',"href",APPICON);
    const mf={name:CONFIG.appName,short_name:CONFIG.appName.slice(0,12),start_url:".",scope:".",
      display:"standalone",orientation:"portrait",background_color:"#eef3fb",theme_color:"#2563eb",
      lang:"ko",description:CONFIG.appName+" — 개인 대시보드",
      icons:[{src:APPICON,sizes:"512x512",type:"image/png",purpose:"any"},
             {src:APPICON,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    set('link[rel="manifest"]',"href","data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(mf)));
  }
})();
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;renderInstall();
  try{ if(document.getElementById("insWrap"))insOpen(INS_VIEW); }catch(x){}});
window.addEventListener("appinstalled",()=>{installEvt=null;renderInstall();
  try{ insClose(); }catch(e){}
  try{ toast("🏠 홈 화면에 추가했어요"); }catch(e){}});
function isStandalone(){
  try{ if(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) return true; }catch(e){}
  return window.navigator.standalone===true;
}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
function renderInstall(){
  const b=document.getElementById("btnApp");if(!b)return;
  b.style.display=isStandalone()?"none":"";
}

/* ---- 지금 어떤 환경에서 열려 있나 ----
   인스타그램·카카오톡 같은 앱 안의 브라우저에서는 홈 화면 추가가 아예 불가능합니다.
   그래서 「무엇을 눌러야 하는지」를 설치 시도 전에 먼저 보여줍니다. */
function insEnv(){
  var u=navigator.userAgent||"", app="";
  if(/Instagram/i.test(u))app="인스타그램";
  else if(/Threads/i.test(u))app="스레드";
  else if(/FBAN|FBAV|FB_IAB/i.test(u))app="페이스북";
  else if(/KAKAOTALK/i.test(u))app="카카오톡";
  else if(/NAVER\(inapp/i.test(u))app="네이버 앱";
  else if(/\bLine\//i.test(u))app="라인";
  else if(/DaumApps/i.test(u))app="다음 앱";
  return {ios:isIOS(), aos:/Android/i.test(u), app:app, std:isStandalone()};
}

/* ---- 홈 화면 추가 안내 ---- */
var INS_AFTER=null, INS_VIEW="done";
function insClose(){
  var w=document.getElementById("insWrap");
  if(w&&w.parentNode)w.parentNode.removeChild(w);
  var f=INS_AFTER; INS_AFTER=null;
  if(typeof f==="function"){ try{ f(); }catch(e){} }

function insOpen(view,after){
  if(arguments.length>1)INS_AFTER=after||null;
  if(isStandalone()){ insClose(); return; }
  var e=insEnv();
  if(!view)view="done";
  INS_VIEW=view;
  var w=document.getElementById("insWrap");
  if(!w){
    w=document.createElement("div");
    w.id="insWrap";
    w.setAttribute("style","position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(9,16,32,.5);padding:14px");
    w.addEventListener("click",function(ev){ if(ev.target===w)insClose(); });
    document.body.appendChild(w);
  }
  w.innerHTML=insHTML(view,e);
}
function insGo(){
  var e=insEnv();
  if(installEvt){
    var ev=installEvt; installEvt=null;
    try{ ev.prompt(); }catch(x){}
    try{ ev.userChoice.then(function(r){ if(!r||r.outcome!=="accepted")insOpen("aos-manual"); else insClose(); }); }
    catch(x){ insClose(); }
    setTimeout(renderInstall,400);
    return;
  }
  if(e.ios){ insOpen(e.app?"ios-inapp":"ios-safari"); return; }
  if(e.aos){ insOpen(e.app?"aos-inapp":"aos-manual"); return; }
  insOpen("desktop");
}
function insCopy(){
  var u=location.href;
  var done=function(){ try{ toast("링크를 복사했어요"); }catch(e){} };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(done,function(){insCopyFB(u,done);});
      return;
    }
  }catch(e){}
  insCopyFB(u,done);
}
function insCopyFB(u,done){
  try{
    var t=document.createElement("textarea");
    t.value=u; t.setAttribute("style","position:fixed;opacity:0");
    document.body.appendChild(t); t.select(); document.execCommand("copy");
    document.body.removeChild(t); done();
  }catch(e){ try{ prompt("아래 주소를 복사해주세요", u); }catch(x){} }
}
function installApp(){
  if(isStandalone()){ try{ toast("이미 홈 화면에 설치돼 있어요"); }catch(e){} return; }
  INS_AFTER=null;
  if(installEvt){ insOpen("aos-prompt"); return; }
  insGo();
}

function bkNagClose(){
  var w=document.getElementById("bkNag");

function bkNagShow(){

    if(!last||last>=addDays(todayStr(),-14))return;              /* 아직 14일 안 지남 */

/* ===== 첫 실행 안내 마법사 ===== */
let ONB={mode:"full",step:0,name:"",tabs:null,sample:true,kit:"balanced",names:{},del:[],undel:[]};
const ONBSTEPS={
  full:["intro","name","sample","kit"],
  name:["name"],
  tabs:["tabs"]
};
/* 처음 한 번만 물어보는 시작 구성 */
const ONBKITS={
  light:   {label:"가볍게 시작하기",     tabs:["daily","project","habit"]},
  balanced:{label:"균형 있게 시작하기",  tabs:["daily","project","book","habit"]},
  all:     {label:"전체 기능 둘러보기",  tabs:null}
};
function onbKit(v){ ONB.kit=v; onbRender(); }
function onbKitTabs(k){
  const it=ONBKITS[k]||ONBKITS.all, all=onbTabList();
  if(!it.tabs) return all.slice();
  const w=it.tabs.filter(x=>all.indexOf(x)>=0);
  return w.length?w:all.slice();
}
function onbKitDesc(k){
  if(!(ONBKITS[k]&&ONBKITS[k].tabs)) return "지금 있는 탭을 전부 켜 둡니다";
  return onbKitTabs(k).map(onbLabel).join(" · ");
}
function onbApplyKit(){
  try{
    const it=ONBKITS[ONB.kit]||ONBKITS.all;
    if(!it.tabs){ DATA.__off=[]; return; }
    const all=onbTabList(), want=onbKitTabs(ONB.kit);
    DATA.__off=all.filter(k=>want.indexOf(k)<0);
  }catch(e){}
}
function onbDelList(){ try{ return (DATA&&Array.isArray(DATA.__del))?DATA.__del.slice():[]; }catch(e){ return []; } }
function onbTabList(){
  const gone=onbDelList().filter(k=>(ONB.undel||[]).indexOf(k)<0);
  const a=Object.keys(SEED).filter(k=>!(SEED[k]&&SEED[k].secret)&&gone.indexOf(k)<0);
  try{
    Object.keys(DATA).forEach(k=>{                 // SEED에 없는 직접 만든 탭도 포함
      if(k.indexOf("__")===0||SEED[k]||a.indexOf(k)>=0)return;
      if(DATA[k]&&DATA[k].secret)return;
      a.push(k);
    });
  }catch(e){}
  return a;
}
/* 다시 만들 수 있는(지워둔) 탭 목록 */
function onbGoneList(){ return onbDelList().filter(k=>SEED[k]&&(ONB.undel||[]).indexOf(k)<0); }
function onbSeedName(k){ return String((SEED[k]&&SEED[k].label)||k).replace(/^\S+\s/,""); }
function onbCurName(k){
  try{ if(ONB&&ONB.names&&ONB.names[k]) return String(ONB.names[k]); }catch(e){}
  let l=null;
  try{ l=(DATA&&DATA[k]&&DATA[k].label)||null; }catch(e){}
  return String(l||(SEED[k]&&SEED[k].label)||k).replace(/^\S+\s/,"");
}
/* 이름 앞 이모지는 그대로 두고 뒤 이름만 갈아끼운다 */
function onbRelabel(k,nm){
  let cl="";
  try{ cl=String((DATA[k]&&DATA[k].label)||(SEED[k]&&SEED[k].label)||""); }catch(e){}
  const m=/^(\S+)\s/.exec(cl);
  return (m?m[1]:"📌")+" "+nm;
}
function onbRename(k){
  const now=onbCurName(k);
  let v=null;
  try{ v=prompt("이 탭을 뭐라고 부를까요?\n(비우고 확인하면 원래 이름으로 돌아가요)",now); }catch(e){ v=null; }
  if(v===null)return;
  v=String(v).replace(/\s+/g," ").trim().slice(0,14);
  if(!ONB.names)ONB.names={};
  ONB.names[k]=v||onbSeedName(k);
  onbRender();
}
function onbDel(k){
  if(!ONB.del)ONB.del=[];
  if(ONB.del.indexOf(k)>=0)return;
  const left=onbTabList().filter(x=>ONB.del.indexOf(x)<0);
  if(left.length<=1){ try{toast("탭은 하나 이상 남아 있어야 해요");}catch(e){} return; }
  let ok=false;
  try{ ok=confirm("'"+onbCurName(k)+"' 탭을 지울까요?\n\n이 탭에 적어둔 기록도 같이 사라져요.\n저장을 누르기 전이라면 되돌릴 수 있어요."); }catch(e){ ok=false; }
  if(!ok)return;
  ONB.del.push(k);
  const i=ONB.tabs.indexOf(k); if(i>=0)ONB.tabs.splice(i,1);
  onbRender();
}
function onbUndel(k){
  if(!ONB.del)return;
  const i=ONB.del.indexOf(k); if(i<0)return;
  ONB.del.splice(i,1);
  if(ONB.tabs.indexOf(k)<0)ONB.tabs.push(k);
  onbRender();
}
/* 예전에 지운 탭을 빈 상태로 다시 만들기 */
function onbRestore(k){
  if(!ONB.undel)ONB.undel=[];
  if(ONB.undel.indexOf(k)<0)ONB.undel.push(k);
  if(ONB.tabs.indexOf(k)<0)ONB.tabs.push(k);
  onbRender();
}
function onbBlankTab(k){
  const s=JSON.parse(JSON.stringify(SEED[k]));
  if(s.items)s.items=[];
  if(s.days)s.days={};
  if(s.entries)s.entries={};
  if(s.routines)s.routines=[];
  if(s.history)s.history=[];
  if("week" in s)s.week=null;
  if(s.followers)s.followers={cur:0,goal:1000};
  if(s.north){s.north.statement="";s.north.why="";s.north.q={1:"",2:"",3:"",4:""};s.north.goals=[];}
  return s;
}
function onbLabel(k){ return String((SEED[k]&&SEED[k].label)||k).replace(/^\S+\s/,""); }
function blankData(){
  const d=JSON.parse(JSON.stringify(SEED));
  Object.keys(d).forEach(k=>{
    const s=d[k];
    if(s.items)s.items=[];
    if(s.days)s.days={};
    if(s.entries)s.entries={};
    if(s.budget)s.budget={};
    if(s.routines)s.routines=[];
    if(s.history)s.history=[];
    if("week" in s)s.week=null;
    if(s.followers)s.followers={cur:0,goal:1000};
    if(s.north){s.north.statement="";s.north.why="";s.north.q={1:"",2:"",3:"",4:""};s.north.goals=[];}
  });
  return d;
}

function onbGo(dir){
  const steps=ONBSTEPS[ONB.mode]||ONBSTEPS.full;
  if(dir<0){
    if(ONB.step>0){ ONB.step--; onbRender(); }
    else onbClose();
    return;
  }
  if(ONB.step<steps.length-1){ ONB.step++; onbRender(); return; }
  onbFinish();
}
function onbApplyTabs(){
  const del=Array.isArray(ONB.del)?ONB.del.slice():[];
  const undel=Array.isArray(ONB.undel)?ONB.undel.slice():[];
  let gone=onbDelList();
  /* (1) 지워둔 탭 다시 만들기 */
  undel.forEach(k=>{
    if(!SEED[k])return;
    gone=gone.filter(x=>x!==k);
    if(!DATA[k]){ try{DATA[k]=onbBlankTab(k);}catch(e){} }
    if(Array.isArray(DATA.__order)&&DATA.__order.indexOf(k)<0) DATA.__order.push(k);
  });
  /* (2) 이름 바꾸기 */
  const names=ONB.names||{};
  Object.keys(names).forEach(k=>{
    if(!DATA[k]||del.indexOf(k)>=0)return;
    const nm=String(names[k]||"").trim();
    if(!nm)return;
    DATA[k].label=onbRelabel(k,nm);
  });
  /* (3) 삭제 — 기록까지 지우고, 다시 생기지 않게 표시 */
  del.forEach(k=>{
    if(gone.indexOf(k)<0)gone.push(k);
    try{delete DATA[k];}catch(e){}
  });
  DATA.__del=gone;
  if(Array.isArray(DATA.__order)) DATA.__order=DATA.__order.filter(k=>del.indexOf(k)<0);
  /* (4) 보임/숨김 */
  DATA.__off=onbTabList().filter(k=>ONB.tabs.indexOf(k)<0&&del.indexOf(k)<0);
}
function onbFinish(){
  if(ONB.mode==="full"){
    DATA=normalize(ONB.sample?JSON.parse(JSON.stringify(SEED)):blankData());
  }
  if(!DATA.__ui)DATA.__ui={};
  if(ONB.mode==="full"||ONB.mode==="name")DATA.__ui.owner=String(ONB.name||"").trim();
  if(ONB.mode==="tabs")onbApplyTabs();
  if(ONB.mode==="full")onbApplyKit();
  DATA.__ui.setup=true;
  const ks=tabKeys();
  if(ks.indexOf(cur)<0)cur=ks[0]||"daily";
  save();
  onbClose();
  render();
  try{
    if(ONB.mode==="full")toast("반가워요"+(DATA.__ui.owner?", "+DATA.__ui.owner+" 님":"")+" 🎉");
    else toast("저장했어요");
  }catch(e){}
  if(ONB.mode==="full"){
    /* 설치 안내를 먼저 보여주고, 닫히면 첫 할 일 유도를 띄웁니다.
       이미 홈 화면 앱으로 실행 중이면 안내는 건너뜁니다. */
    try{
      if(isStandalone()) setTimeout(nudgeShow,1100);
      else setTimeout(function(){ insOpen("done", function(){ setTimeout(nudgeShow,320); }); },700);
    }catch(e){ try{ setTimeout(nudgeShow,1100); }catch(x){} }
  }
}


/* ===================== 앱 안 브라우저(인앱) 차단 안내 ====================
   인스타그램·카카오톡 같은 앱 안의 브라우저는 저장 공간이 따로 놀거나
   앱을 닫으면 기록이 통째로 사라질 수 있습니다.
   그래서 여기서는 시작 설정(온보딩)도, 기록 작성도 하지 않고
   Safari / Chrome 으로 옮겨 열도록 전체 화면으로 안내합니다. */
var IAB=null, IABPEEK=false, IABWARNAT=0;
function iabApp(){
  if(IAB===null){ try{ IAB=insEnv().app||""; }catch(e){ IAB=""; } }
  return IAB;
}
function iabOn(){
  try{ if(isStandalone()) return false; }catch(e){}
  return !!iabApp();
}
function iabBrowser(){ try{ return isIOS()?"Safari":"Chrome"; }catch(e){ return "Chrome"; } }
function iabWarn(){
  var t=Date.now(); if(t-IABWARNAT<4000) return; IABWARNAT=t;
  try{ toast("앱 안 브라우저라 저장되지 않아요"); }catch(e){}
}
function iabBlock(){ iabShow(); }
function iabHide(){
  var w=document.getElementById("iabWrap");
  if(w&&w.parentNode)w.parentNode.removeChild(w);
  try{ document.documentElement.style.overflow=""; }catch(e){}
}
function iabPeek(){
  IABPEEK=true; iabHide(); iabBar();
  try{ toast("둘러보기 중이에요 · 기록은 저장되지 않아요"); }catch(e){}
}
function iabBar(){
  if(document.getElementById("iabBar"))return;
  var b=document.createElement("div");
  b.id="iabBar";
  b.setAttribute("style","position:fixed;left:0;right:0;bottom:0;z-index:9997;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#0f1b33;color:#fff;font-size:12.5px;line-height:1.45");
  b.innerHTML='<span style="flex:1 1 auto">둘러보기 중이에요 · 기록은 저장되지 않아요</span>'
    +'<button type="button" onclick="iabShow()" style="flex:0 0 auto;padding:7px 12px;border:0;border-radius:9px;background:#fff;color:#0f1b33;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit">'+iabBrowser()+'에서 열기</button>';
  document.body.appendChild(b);
}
function iabStepsHtml(){
  var ios=false; try{ ios=isIOS(); }catch(e){}
  if(ios){
    return insStep(1,"화면 <b>오른쪽 아래</b>(또는 오른쪽 위)의 <b>'…'</b> 버튼 누르기")
      + insStep(2,"<b>'Safari로 열기'</b> 또는 <b>'외부 브라우저에서 열기'</b> 선택")
      + insStep(3,"열린 <b>Safari</b>에서 시작하기");
  }
  return insStep(1,"화면 <b>오른쪽 위</b>의 <b>'⋮'</b> 또는 <b>'…'</b> 버튼 누르기")
    + insStep(2,"<b>'다른 브라우저로 열기'</b> 또는 <b>'Chrome으로 열기'</b> 선택")
    + insStep(3,"열린 <b>Chrome</b>에서 시작하기");
}
function iabShow(){
  if(!iabOn()) return;
  try{ insClose(); }catch(e){}
  var app=iabApp(), br=iabBrowser();
  var w=document.getElementById("iabWrap");
  if(!w){
    w=document.createElement("div");
    w.id="iabWrap";
    w.setAttribute("role","dialog");
    w.setAttribute("aria-modal","true");
    w.setAttribute("style","position:fixed;inset:0;z-index:100000;background:var(--bg,#f6f8fc);color:var(--ink,#0f1b33);display:flex;align-items:center;justify-content:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;font-family:inherit");
    document.body.appendChild(w);
  }
  w.innerHTML='<div style="max-width:420px;width:100%">'
    +'<div style="font-size:40px;line-height:1;margin-bottom:14px">🌐</div>'
    +'<div style="font-size:22px;font-weight:800;line-height:1.35;margin-bottom:10px">'+esc(br)+'에서 열어주세요</div>'
    +'<div style="font-size:14.5px;line-height:1.7;opacity:.85;margin-bottom:8px">'
      +(app?'지금은 <b>'+esc(app)+'</b> 안의 브라우저예요. ':'')
      +'앱 안의 브라우저에서는 적은 기록이 저장되지 않고 사라질 수 있어요.</div>'
    +'<div style="font-size:13.5px;line-height:1.65;margin:0 0 18px;padding:11px 13px;border-radius:11px;background:rgba(37,99,235,.09)">그래서 여기서는 <b>시작 설정과 기록 작성을 잠시 멈춰</b> 뒀어요. '+esc(br)+'에서 열면 바로 시작할 수 있어요.</div>'
    +'<ol style="list-style:none;padding:0;margin:0 0 16px">'+iabStepsHtml()+'</ol>'
    +insBtn("링크 복사하기","iabCopy()",1)
    +insBtn("다시 확인","iabRetry()",0)
    +'<button type="button" onclick="iabPeek()" style="display:block;width:100%;margin:4px 0 0;padding:10px;border:0;background:transparent;color:inherit;opacity:.55;font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:inherit">그래도 여기서 둘러보기 (저장 안 됨)</button>'
    +'</div>';
  try{ document.documentElement.style.overflow="hidden"; }catch(e){}
}
function iabCopy(){ try{ insCopy(); }catch(e){} }
function iabRetry(){ try{ location.reload(); }catch(e){} }

/* ---- 처음 한 번만 뜨는 첫 기록 유도 ---- */
function nudgeClose(){
  var w=document.getElementById("nudgeWrap");
  if(w&&w.parentNode)w.parentNode.removeChild(w);
  try{ if(!DATA.__ui)DATA.__ui={}; DATA.__ui.nudged=true; save(); }catch(e){}
}
function nudgeGo(){
  nudgeClose();
  /* 데일리 투두 탭으로 옮기고, 그 탭의 「할 일 쓰기」 입력창을 바로 띄웁니다 */
  try{ var ks=tabKeys(); if(ks.indexOf("daily")>=0)go("daily"); }catch(e){}
  try{ openEdit(); }catch(e){ try{ openQuick(); }catch(x){} }
}
function nudgeShow(){
  try{ if(DATA&&DATA.__ui&&DATA.__ui.nudged)return; }catch(e){}
  if(document.getElementById("nudgeWrap"))return;
  var w=document.createElement("div");
  w.id="nudgeWrap";
  w.setAttribute("style","position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9998;width:min(400px,calc(100% - 24px))");
  w.innerHTML='<div role="status" style="position:relative;background:var(--card,#fff);color:var(--tx,#111);border:1px solid var(--line,#dfe4ee);border-radius:16px;padding:16px 16px 14px;box-shadow:0 14px 40px rgba(12,20,40,.22)">'
    +'<button type="button" onclick="nudgeClose()" aria-label="닫기" style="position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;background:transparent;color:inherit;opacity:.45;font-size:15px;line-height:1;cursor:pointer">✕</button>'
    +'<div style="font-size:15.5px;font-weight:800;margin-bottom:5px">가볍게 시작해볼까요?</div>'
    +'<div style="font-size:13.5px;line-height:1.6;opacity:.8;margin-bottom:12px">오늘 해야 할 일 하나만 적어보세요.</div>'
    +'<button type="button" id="nudgeBtn" onclick="nudgeGo()" style="width:100%;padding:11px 12px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-size:14.5px;font-weight:800;cursor:pointer">첫 할 일 작성하기</button>'
    +'</div>';
  document.body.appendChild(w);
}

/* ---- 기록을 못 찾았을 때 뜨는 복구 화면 ---- */
function lostBtn(id,label,main){
  return '<button id="'+id+'" style="display:block;width:100%;margin:0 0 9px;padding:13px 14px;border-radius:12px;border:1px solid '+(main?"transparent":"var(--line,#d8dde8)")+';background:'+(main?"#2563eb":"transparent")+';color:'+(main?"#fff":"var(--tx,#111)")+';font-size:15px;font-weight:700;cursor:pointer;text-align:left">'+label+'</button>';
}
function lostShow(){
  if(document.getElementById("lostWrap"))return;
  var hasDrive=false; try{hasDrive=!!(gsMeta&&gsMeta.cid);}catch(e){}
  var w=document.createElement("div");
  w.id="lostWrap";
  w.setAttribute("style","position:fixed;inset:0;z-index:99999;background:rgba(10,14,26,.78);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto");
  w.innerHTML='<div role="dialog" aria-modal="true" style="max-width:460px;width:100%;background:var(--card,#fff);color:var(--tx,#111);border-radius:18px;padding:22px 20px;box-shadow:0 18px 60px rgba(0,0,0,.4);font-size:15px;line-height:1.65">'
    +'<div style="font-size:20px;font-weight:800;margin-bottom:10px">🔎 기록을 찾지 못했어요</div>'
    +'<div style="opacity:.85;margin-bottom:8px">이 브라우저에 저장돼 있던 기록이 보이지 않습니다. 지금 화면에 보이는 건 예시 내용이에요.</div>'
    +'<div style="margin-bottom:16px;padding:10px 12px;border-radius:10px;background:rgba(37,99,235,.09);font-size:14px"><b>아래에서 하나를 고르기 전까지 아무것도 저장하지 않습니다.</b> 예전 기록이 지워질 걱정은 없어요.</div>'
    +(hasDrive?lostBtn("lostD","☁ 구글 드라이브에서 되살리기",true):"")
    +lostBtn("lostF","📂 백업 파일에서 되살리기",false)
    +lostBtn("lostN","🆕 그냥 새로 시작하기",false)
    +'<div id="lostMsg" style="margin-top:10px;font-size:13.5px;opacity:.85;min-height:18px"></div>'
    +'</div>';
  document.body.appendChild(w);
  var bd=document.getElementById("lostD"); if(bd)bd.onclick=lostDrive;
  var bf=document.getElementById("lostF"); if(bf)bf.onclick=lostFile;
  var bn=document.getElementById("lostN"); if(bn)bn.onclick=lostFresh;
}
function lostMsg(t){var m=document.getElementById("lostMsg");if(m)m.textContent=t;}
function lostClose(){var w=document.getElementById("lostWrap");if(w&&w.parentNode)w.parentNode.removeChild(w);}
async function lostDrive(){
  try{
    lostMsg("드라이브에 연결하는 중…");
    gsMeta.use=true; gsSaveMeta();
    await gsAuth(true);
    lostMsg("기록을 찾는 중…");
    var r=await gsPull();
    if(!r){ lostMsg("드라이브에 저장된 기록이 없어요."); return; }
    LOSTMODE=false; ALLOWSHRINK=true;
    gsAdopt(r);
    lostClose();
    try{toast("✓ 드라이브에서 되살렸어요");}catch(e){}
  }catch(e){ lostMsg("⚠ "+((e&&e.message)||e)); }
}
function lostFile(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(o&&o.data&&typeof o.data==="object"&&(o.v||o.at)) o=o.data;
        LOSTMODE=false; ALLOWSHRINK=true;
        DATA=normalize(o);
        if(tabKeys().indexOf(cur)<0)cur=tabKeys()[0];
        render(); lostClose();
        try{toast("✓ 백업 파일에서 되살렸어요");}catch(e){}
      }catch(e){ lostMsg("⚠ 이 파일은 읽을 수 없어요. 다른 파일을 골라주세요."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function lostFresh(){
  if(!confirm("예시 내용으로 새로 시작할까요?\n\n예전 기록을 되살릴 방법이 남아 있다면 지금은 취소하세요."))return;
  LOSTMODE=false; ALLOWSHRINK=true;
  save(); lostClose();
}
function resetAll(){
  if(!confirm("모든 내용을 샘플 데이터로 되돌립니다. 계속할까요?"))return;
  ALLOWSHRINK=true;
  DATA=normalize(JSON.parse(JSON.stringify(SEED)));cur=tabKeys()[0]||"daily";render();
}

document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeEdit();});
document.getElementById("detail").addEventListener("click",e=>{if(e.target.id==="detail")closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){
  if(document.getElementById("insWrap")){ insClose(); return; }
  if(document.getElementById("bkNag")){ bkNagClose(); return; }
  const o=document.getElementById("onb");
  if(o&&!o.hidden){ if(ONB.mode!=="full")onbClose(); return; }
  closeEdit();if(detailId)closeDetail();}});
setInterval(()=>{
  const d=new Date();
  document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
},1000);
renderLogo();
setTheme(themeGet());
render();
renderInstall();
if(LOSTFROM){ try{save();}catch(e){} try{toast("✓ 이전 기록을 찾아서 되살렸어요");}catch(e){} }
if(LOSTMODE && !iabOn()){ try{lostShow();}catch(e){} }
if(iabOn()){
  /* 앱 안 브라우저 —— 이름 입력·시작 설정보다 먼저 전체 화면 안내를 띄웁니다 */
  try{ iabShow(); }catch(e){}
}
else if(FIRSTRUN && !LOSTMODE && !(DATA.__ui&&DATA.__ui.setup) && !CONFIG.owner) onbStart("full");
else if(!LOSTMODE){ try{ setTimeout(bkNagShow,1400); }catch(e){} }
if(gsOn()&&!LOSTMODE&&!iabOn()){gsMeta.dirty=false;gsSaveMeta();setTimeout(()=>{gsSync();},1200);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)gsSync();});}
</script>
</body>
